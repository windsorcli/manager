apiVersion: v1
kind: Namespace
metadata:
  name: omni
  labels:
    # Omni's pod runs its own WireGuard interface for SideroLink: NET_ADMIN and a
    # /dev/net/tun hostPath mount, neither of which baseline allows.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    use-custom-ca: "true"
