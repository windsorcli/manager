---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omni
  namespace: omni
spec:
  interval: 5m
  timeout: 10m
  targetNamespace: omni
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: omni
      # renovate: datasource=docker depName=omni-chart package=ghcr.io/siderolabs/charts/omni
      version: 2.9.3
      sourceRef:
        kind: HelmRepository
        name: siderolabs
  values:
    fullnameOverride: omni
    # Single replica: embedded etcd does not support multiple active writers.
    replicaCount: 1
    config:
      services:
        api:
          advertisedURL: https://${omni_hostname}
          certFile: /certs/api/tls.crt
          keyFile: /certs/api/tls.key
        kubernetesProxy:
          advertisedURL: https://${omni_kube_proxy_hostname}
          certFile: /certs/kube-proxy/tls.crt
          keyFile: /certs/kube-proxy/tls.key
        machineAPI:
          advertisedURL: https://${omni_machine_api_hostname}
          certFile: /certs/machine-api/tls.crt
          keyFile: /certs/machine-api/tls.key
        siderolink:
          wireGuard:
            advertisedEndpoint: ${omni_wireguard_advertised_endpoint}
      auth:
        # SAML client registered by the omni/saml-client Job. Metadata is fetched
        # directly from Keycloak's public SAML descriptor, so no secret handoff is
        # needed for this direction.
        saml:
          enabled: true
          metadata: ${keycloak_saml_metadata_url}
          nameIDFormat: email
          labelRules:
            saml.omni.sidero.dev/role: role
        initialUsers: ${omni_initial_admins}
      storage:
        default:
          kind: etcd
          etcd:
            embedded: true
            privateKeySource: file:///omni.asc
      registries:
        imageFactoryBaseURL: ${omni_image_factory_url}
    # Materialized by the facet's secrets: block, data key `omni.asc`.
    etcdEncryptionKey:
      existingSecret: omni-etcd-encryption-key
    persistence:
      enabled: true
      storageClassName: ${omni_persistence_storage_class}
      size: ${omni_persistence_size}
    extraVolumes:
      - name: api-tls
        secret:
          secretName: omni-api-tls
      - name: kube-proxy-tls
        secret:
          secretName: omni-kube-proxy-tls
      - name: machine-api-tls
        secret:
          secretName: omni-machine-api-tls
    extraVolumeMounts:
      - name: api-tls
        mountPath: /certs/api
        readOnly: true
      - name: kube-proxy-tls
        mountPath: /certs/kube-proxy
        readOnly: true
      - name: machine-api-tls
        mountPath: /certs/machine-api
        readOnly: true
    service:
      main:
        type: ${omni_wireguard_service_type}
      k8sProxy:
        type: ${omni_wireguard_service_type}
      wireguard:
        type: ${omni_wireguard_service_type}
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
