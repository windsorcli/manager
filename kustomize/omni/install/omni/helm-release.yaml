---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omni
  namespace: omni
spec:
  interval: 5m
  timeout: 10m
  targetNamespace: omni
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: omni
      # renovate: datasource=docker depName=omni-chart package=ghcr.io/siderolabs/charts/omni
      version: 2.9.3
      sourceRef:
        kind: HelmRepository
        name: siderolabs
  values:
    fullnameOverride: omni
    # Single replica: embedded etcd does not support multiple active writers.
    replicaCount: 1
    config:
      account:
        id: ${omni_account_id}
      services:
        # No certFile/keyFile: TLS terminates at the shared gateway (HTTPRoutes in
        # the omni/gateway component), the same pattern Keycloak uses. Only
        # SideroLink's raw WireGuard tunnel can't fit that model, so it keeps its
        # own dedicated Service below.
        api:
          advertisedURL: https://${omni_hostname}
        kubernetesProxy:
          advertisedURL: https://${omni_kube_proxy_hostname}
        machineAPI:
          advertisedURL: https://${omni_machine_api_hostname}
        siderolink:
          wireGuard:
            advertisedEndpoint: ${omni_wireguard_advertised_endpoint}
      auth:
        # The chart defaults auth0 on; only one provider can be enabled at a time.
        auth0:
          enabled: false
        # SAML client registered by the omni/saml-client Job. `url` — not
        # `metadata`, despite its values.yaml description — is what Omni actually
        # fetches live over HTTP (internal/backend/saml/saml.go: cfg.Metadata is
        # read via os.ReadFile as a local path; only cfg.Url is HTTP-fetched). No
        # secret handoff is needed for this direction. attributeRules is a
        # required field even when empty — labelRules alone isn't enough to
        # satisfy the chart's schema.
        saml:
          enabled: true
          url: ${keycloak_saml_url}
          nameIDFormat: email
          labelRules:
            saml.omni.sidero.dev/role: role
          attributeRules: {}
        initialUsers: ${omni_initial_admins}
      storage:
        default:
          kind: etcd
          etcd:
            embedded: true
            privateKeySource: file:///omni.asc
      registries:
        imageFactoryBaseURL: ${omni_image_factory_url}
    # Materialized by the facet's secrets: block, data key `omni.asc`.
    etcdEncryptionKey:
      existingSecret: omni-etcd-encryption-key
    persistence:
      enabled: true
      storageClassName: ${omni_persistence_storage_class}
      size: ${omni_persistence_size}
    # main and k8sProxy stay ClusterIP (chart default) — the gateway reaches them
    # internally. wireguard is the one Service that needs external exposure of its
    # own, the same NodePort/LoadBalancer split CoreDNS's own loadbalancer
    # component uses for its UDP traffic.
    service:
      wireguard:
        type: ${omni_wireguard_service_type}
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
    # windsorcli/core#2406: docker-desktop's split-horizon DNS can't tell Omni's
    # own in-cluster calls apart from the host's, so factory.<domain> resolves to
    # 127.0.0.1 (meant for the host) even from inside this pod. Resolve the
    # factory Service's real ClusterIP via its own in-cluster DNS name — which
    # isn't under the affected zone — and inject it into /etc/hosts before Omni
    # starts. No-op (empty host, plain copy) when the factory is external or
    # disabled.
    initContainers:
      - name: hosts-image-factory
        image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            cp /etc/hosts /work/hosts
            host="${omni_image_factory_host}"
            if [ -n "$host" ]; then
              ip=$(getent hosts image-factory.image-factory.svc.cluster.local | awk '{print $1}' | head -1)
              echo "$ip $host" >> /work/hosts
            fi
        volumeMounts:
          - name: hosts-override
            mountPath: /work
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
    extraVolumes:
      - name: hosts-override
        emptyDir:
          sizeLimit: 1Mi
    extraVolumeMounts:
      - name: hosts-override
        mountPath: /etc/hosts
        subPath: hosts
