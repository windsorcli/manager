# NodePort environments keep the chart's own dedicated Service rather than routing
# through the gateway: publishing an extra NodePort there would mean patching Core's
# shared EnvoyProxy object from a separate Kustomization, an unverified SSA merge
# (see docs/adr/0005-siderolink-gateway-exposure.md).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omni
  namespace: omni
spec:
  values:
    service:
      wireguard:
        type: NodePort
        nodePort: ${omni_wireguard_node_port}
