# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

substitutions:
  harbor_hostname:
    required_when: "`registry.driver` is `harbor`"
    description: "Base hostname Harbor's UI/API advertises, from `registry.harbor.hostname` or derived as `harbor.<domain>`. Includes the docker-desktop `:8443` port suffix where the chart's own `externalURL` needs it."
  harbor_storage_class:
    required_when: "`registry.driver` is `harbor`"
    description: "Storage class for the registry PVC when no object store backs it. Defaults to `cluster.storage.class`, or `single`."
  harbor_registry_size:
    required_when: "`registry.driver` is `harbor`"
    description: "Size of the registry PVC when no object store backs it. Defaults to `20Gi`."
  harbor_registry_bucket:
    required_when: "`harbor/s3`"
    description: "Bucket backing Harbor's registry. Built from `object_store.prefix`, the same expression the object-store Terraform module provisions."
  harbor_registry_region:
    required_when: "`harbor/s3`"
    description: "Region embedded in the S3 v4 signature, from `object_store.region`."
  harbor_registry_endpoint:
    required_when: "`harbor/s3`"
    description: "S3 endpoint Harbor's registry writes to, from `object_store.endpoint`."
  registry_storage_class:
    required_when: "`registry.driver` is `distribution`"
    description: "Storage class for the distribution driver's PVC when no object store backs it. Defaults to `cluster.storage.class`, or `single`."
  registry_storage_size:
    required_when: "`registry.driver` is `distribution`"
    description: "Size of the distribution driver's PVC when no object store backs it. Defaults to `registry.distribution.storage_size`, or `10Gi`."
  registry_replicas:
    required_when: "`registry.driver` is `distribution`"
    description: "Replica count for the distribution driver's StatefulSet. 2 under `topology: ha` when object storage backs it (a PVC cannot take two), else 1."
  registry_bucket:
    required_when: "`distribution/s3`"
    description: "Bucket backing the distribution driver. Built from `object_store.prefix`, the same expression the object-store Terraform module provisions."
  registry_region:
    required_when: "`distribution/s3`"
    description: "Region embedded in the S3 v4 signature, from `object_store.region`."
  registry_endpoint:
    required_when: "`distribution/s3`"
    description: "S3 endpoint the distribution driver writes to, from `object_store.endpoint`."
  external_domain:
    required_when: "`harbor/gateway`"
    description: "Domain the gateway route publishes under; the hostname is `harbor.<external_domain>`. Public domain when set, otherwise the private domain or the cluster domain."
  keycloak_realm:
    required_when: "`harbor/oidc`"
    description: "Identity realm the OIDC client registers against, from `identity_effective.realm`."
  oidc_issuer:
    required_when: "`harbor/oidc`"
    description: "External OIDC discovery issuer, from `identity_effective.issuer`."
  oidc_admin_group:
    required_when: "`harbor/oidc`"
    description: "Keycloak group mapped to Harbor's admin role via the OIDC groups claim. Fixed at `platform-admins`."
  oidc_verify_cert:
    required_when: "`harbor/oidc`"
    description: "Whether Harbor verifies the identity provider's TLS certificate. False only in dev mode."
  gc_schedule:
    required_when: "`harbor/gc`"
    description: "Cron expression for Harbor's GC schedule, from `registry.harbor.gc.schedule`. 6 fields, seconds first."
  gc_delete_untagged:
    required_when: "`harbor/gc`"
    description: "Whether GC also deletes untagged artifacts, from `registry.harbor.gc.delete_untagged`."

components:
  database:
    enable_when: "`registry.driver` is `harbor` (default `distribution`)"
    description: "Dedicated CloudNativePG `Cluster` (`harbor-db`) — Harbor's Postgres, not the chart's bundled one."
  harbor:
    enable_when: "`registry.driver` is `harbor` (default `distribution`)"
    description: "Helm release of the official `goharbor/harbor-helm` chart in `harbor`. Local admin auth."
  harbor/s3:
    enable_when: "`registry.driver` is `harbor` and `object_store.driver` is `hetzner` or `aws`"
    description: "Backs Harbor with a bucket from the platform's object store instead of a PVC. Own bucket, own destroy policy — not shared with the distribution driver's."
  harbor/oidc:
    enable_when: "`registry.driver` is `harbor`, `identity.enabled == true`, and `registry.harbor.sso` is not explicitly false"
    description: "Admin-API Job that registers Harbor's OIDC client in the platform realm and configures Harbor for OIDC auth, group-mapped to `platform-admins`. A named `oidc` resources variant of the `registry` flux system (`registry-resources-oidc`) so it depends on identity without gating Harbor's install or gateway route."
  harbor/gateway:
    enable_when: "`registry.driver` is `harbor` and `gateway.enabled == true`"
    description: "HTTPRoute on Core's canonical `external` Gateway. Lives in the resources tier and depends on `gateway-resources`. Without a gateway, reach Harbor by port-forwarding the `harbor` Service in `registry`."
  harbor/proxy-cache:
    enable_when: "`registry.driver` is `harbor` and `registry.harbor.proxy_cache` has at least one entry"
    description: "Admin-API Job that creates a Harbor Registry endpoint and proxy-cache Project for each configured upstream. Shares the `admin-jobs` resources variant with `harbor/gc` — both depend only on Harbor's own install, unlike `harbor/oidc`, which also needs identity."
  harbor/gc:
    enable_when: "`registry.driver` is `harbor` and `registry.harbor.gc.enabled` is not explicitly false (default on)"
    description: "Admin-API Job that sets Harbor's own GC schedule via its admin API. Harbor's jobservice runs GC on that schedule afterward; the Job only sets the schedule once. Shares the `admin-jobs` resources variant with `harbor/proxy-cache`."
  distribution:
    enable_when: "`registry.driver` is `distribution` (the default)"
    description: "Bare, anonymous `distribution/distribution` StatefulSet + Service in `registry`. No auth, no scanning, no UI — a `NetworkPolicy` restricts ingress to image-factory's own pods, in their own namespace. The cheap default for a single internal consumer."
  distribution/pvc:
    enable_when: "`registry.driver` is `distribution` and no object store backs it"
    description: "Backs the distribution driver with a PersistentVolumeClaim on the cluster's default storage class."
  distribution/s3:
    enable_when: "`registry.driver` is `distribution` and `object_store.driver` is `hetzner` or `aws`"
    description: "Backs the distribution driver with a bucket from the platform's object store instead of a PVC."

dependencies:
  pki:
    required_when: "`registry.driver` is `harbor`"
    reason: "Harbor is served over TLS, and the certificate is issued by the cluster issuer cert-manager installs."
  gateway:
    required_when: "`registry.driver` is `harbor` and `gateway.enabled == true`"
    reason: "The route CRDs have to exist before the chart renders an HTTPRoute."
  database:
    required_when: "`registry.driver` is `harbor`"
    reason: "The CloudNativePG operator has to exist before this facet's own `harbor-db` Cluster can reconcile."
  identity:
    required_when: "`harbor/oidc`"
    reason: "The OIDC client registers against the platform realm's admin API."
