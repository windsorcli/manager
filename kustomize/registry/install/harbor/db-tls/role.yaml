# harbor-db-ca is CNPG's keypair Secret (cert + key) -- never Harbor's own; it only
# gets the cert-only copy this Job writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-db-tls
  namespace: registry
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["harbor-db-ca"]
    verbs: ["get"]
  # resourceNames can't scope create -- the name isn't known at authorization time.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["harbor-db-ca-cert"]
    verbs: ["get", "update", "patch"]
