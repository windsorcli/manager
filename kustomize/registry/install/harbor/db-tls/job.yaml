# Copies just ca.crt out of harbor-db-ca into a cert-only Secret; caBundleSecretName
# mounts the whole named Secret, so the keypair itself must never be named there.
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-db-tls
  namespace: registry
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 2400
  template:
    spec:
      serviceAccountName: harbor-db-tls
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      containers:
        - name: extract-db-ca-cert
          # artifact: type=image name=ghcr.io/windsorcli/utils
          image: ghcr.io/windsorcli/utils:1.37.2-r1@sha256:fe4838c4687df97b318d83138801592e07fcaab9df091a883bb121045958b38e
          volumeMounts:
            - name: work
              mountPath: /work
          env:
            - name: HOME
              value: /work
            - name: TMPDIR
              value: /work
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              umask 077
              SOURCE_SECRET="harbor-db-ca"
              TARGET_SECRET="harbor-db-ca-cert"

              i=0
              while :; do
                if kubectl get secret "$${SOURCE_SECRET}" >/dev/null 2>&1; then
                  break
                fi
                i=$$((i + 1))
                if [ "$${i}" -ge 120 ]; then
                  echo "timed out waiting for secret $${SOURCE_SECRET}" >&2
                  exit 1
                fi
                sleep 5
              done

              kubectl get secret "$${SOURCE_SECRET}" -o jsonpath='{.data.ca\.crt}' \
                | base64 -d > /work/ca.crt

              kubectl create secret generic "$${TARGET_SECRET}" \
                --from-file=ca.crt=/work/ca.crt \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "wrote $${TARGET_SECRET}"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
