# Registers Harbor's OIDC client in the platform realm, then configures Harbor for OIDC auth
# over its admin API. Creates the client if absent; does not manage drift afterward. Reads
# the bootstrap admin credential from system-identity via the Role/RoleBinding below; the
# client secret is generated by Keycloak and read back to configure Harbor.
#
# The client-registration half becomes a declarative KeycloakOIDCClient CR once Core enables
# Keycloak's client-admin-api:v2 server feature (preview as of Keycloak 26.7); at that point
# this Job shrinks to only the Harbor-side configuration, which has no declarative surface.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-harbor-oidc
  namespace: registry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-harbor-oidc
  namespace: system-identity
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["${keycloak_admin_secret}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-harbor-oidc
  namespace: system-identity
subjects:
  - kind: ServiceAccount
    name: keycloak-harbor-oidc
    namespace: registry
roleRef:
  kind: Role
  name: keycloak-harbor-oidc
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-harbor-oidc
  namespace: registry
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  # Bounds the Keycloak and Harbor wait loops below: 300 x 5s plus 120 x 5s
  # (2100s) at minimum, with headroom for retried curl attempts.
  activeDeadlineSeconds: 2400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: keycloak-harbor-oidc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      containers:
        - name: configure-oidc
          # renovate: datasource=docker depName=kubectl package=alpine/k8s
          image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
          volumeMounts:
            - name: work
              mountPath: /work
          env:
            - name: HOME
              value: /work
            - name: TMPDIR
              value: /work
            # Same-namespace secrets resolve via secretKeyRef; only the Keycloak admin
            # secret (in system-identity) needs the cross-namespace Role above.
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-admin-password
                  key: HARBOR_ADMIN_PASSWORD
          # $${...} are shell variables; ${...} are Windsor substitutions.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              umask 077
              KC="http://keycloak-service.system-identity:8080"
              REALM="${keycloak_realm}"
              CLIENT_ID="harbor"
              REDIRECT="https://${harbor_hostname}/c/oidc/callback"
              WEB_ORIGIN="https://${harbor_hostname}"
              # In-cluster Harbor API through its nginx front (the `harbor` Service, :80).
              HARBOR="http://harbor.registry.svc.cluster.local"

              # secretKeyRef only resolves same-namespace; the admin secret lives in
              # system-identity, so fetch it via the RBAC Role granted above instead.
              ADMIN_USER=$(kubectl get secret ${keycloak_admin_secret} -n system-identity -o jsonpath='{.data.username}' | base64 -d)
              kubectl get secret ${keycloak_admin_secret} -n system-identity -o jsonpath='{.data.password}' | base64 -d > /work/pw

              i=0
              while :; do
                token=$(curl -sf --connect-timeout 5 --max-time 15 \
                  --data-urlencode "client_id=admin-cli" \
                  --data-urlencode "username=$${ADMIN_USER}" \
                  --data-urlencode "password@/work/pw" \
                  --data-urlencode "grant_type=password" \
                  "$${KC}/realms/master/protocol/openid-connect/token" 2>/dev/null \
                  | jq -r '.access_token // empty') || true
                if [ -n "$${token}" ]; then break; fi
                i=$$((i + 1))
                if [ "$${i}" -ge 300 ]; then
                  echo "timed out authenticating to the keycloak admin api" >&2
                  exit 1
                fi
                sleep 5
              done
              printf 'Authorization: Bearer %s' "$${token}" > /work/hdr

              find_cid() {
                curl -sf --connect-timeout 5 --max-time 15 -H @/work/hdr -G \
                  --data-urlencode "clientId=$${CLIENT_ID}" \
                  "$${KC}/admin/realms/$${REALM}/clients" | jq -r '.[0].id // empty'
              }
              cid=$(find_cid)
              if [ -n "$${cid}" ]; then
                echo "harbor oidc client already registered ($${cid})"
              else
                # Confidential client with the group-membership mapper Harbor reads for role
                # mapping. Keycloak generates the client secret; it is read back below.
                jq -n --arg redirect "$${REDIRECT}" --arg origin "$${WEB_ORIGIN}" '{
                  clientId: "harbor",
                  enabled: true,
                  protocol: "openid-connect",
                  publicClient: false,
                  standardFlowEnabled: true,
                  redirectUris: [$redirect],
                  webOrigins: [$origin],
                  protocolMappers: [
                    {
                      name: "groups",
                      protocol: "openid-connect",
                      protocolMapper: "oidc-group-membership-mapper",
                      config: {
                        "full.path": "false",
                        "id.token.claim": "true",
                        "access.token.claim": "true",
                        "userinfo.token.claim": "true",
                        "claim.name": "groups"
                      }
                    }
                  ]
                }' > /work/client.json
                http_code=$(curl -s -o /work/create-response -w '%{http_code}' \
                  --connect-timeout 5 --max-time 15 -H @/work/hdr \
                  -H "Content-Type: application/json" \
                  -d @/work/client.json \
                  "$${KC}/admin/realms/$${REALM}/clients")
                if [ "$${http_code}" -lt 200 ] || [ "$${http_code}" -ge 300 ]; then
                  echo "failed to create harbor oidc client (HTTP $${http_code}):" >&2
                  cat /work/create-response >&2
                  exit 1
                fi
                echo "registered harbor oidc client"
                cid=$(find_cid)
              fi
              if [ -z "$${cid}" ]; then
                echo "could not resolve the harbor oidc client id" >&2
                exit 1
              fi
              CLIENT_SECRET=$(curl -sf --connect-timeout 5 --max-time 15 -H @/work/hdr \
                "$${KC}/admin/realms/$${REALM}/clients/$${cid}/client-secret" \
                | jq -r '.value // empty')
              if [ -z "$${CLIENT_SECRET}" ]; then
                echo "could not read the harbor oidc client secret" >&2
                exit 1
              fi

              # Wait for Harbor's API to answer, then switch it to OIDC.
              j=0
              while :; do
                if curl -sf --connect-timeout 5 --max-time 15 \
                  -u "admin:$${HARBOR_ADMIN_PASSWORD}" \
                  "$${HARBOR}/api/v2.0/systeminfo" >/dev/null 2>&1; then
                  break
                fi
                j=$$((j + 1))
                if [ "$${j}" -ge 120 ]; then
                  echo "timed out waiting for the harbor api" >&2
                  exit 1
                fi
                sleep 5
              done

              jq -n --arg endpoint "${oidc_issuer}" --arg secret "$${CLIENT_SECRET}" \
                --arg admin_group "${oidc_admin_group}" '{
                auth_mode: "oidc_auth",
                oidc_name: "keycloak",
                oidc_endpoint: $endpoint,
                oidc_client_id: "harbor",
                oidc_client_secret: $secret,
                oidc_groups_claim: "groups",
                oidc_admin_group: $admin_group,
                oidc_user_claim: "preferred_username",
                oidc_scope: "openid,profile,email",
                oidc_auto_onboard: true,
                oidc_verify_cert: ${oidc_verify_cert}
              }' > /work/harbor-oidc.json
              http_code=$(curl -s -o /work/harbor-response -w '%{http_code}' \
                --connect-timeout 5 --max-time 30 -u "admin:$${HARBOR_ADMIN_PASSWORD}" \
                -X PUT -H "Content-Type: application/json" \
                -d @/work/harbor-oidc.json \
                "$${HARBOR}/api/v2.0/configurations")
              if [ "$${http_code}" -lt 200 ] || [ "$${http_code}" -ge 300 ]; then
                echo "failed to configure harbor oidc (HTTP $${http_code}):" >&2
                cat /work/harbor-response >&2
                exit 1
              fi
              echo "configured harbor for oidc auth"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
