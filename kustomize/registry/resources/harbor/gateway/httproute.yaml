apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: registry
spec:
  parentRefs:
    - kind: Gateway
      name: external
      namespace: system-gateway
      sectionName: web-http
    - kind: Gateway
      name: external
      namespace: system-gateway
      sectionName: web-https
  hostnames:
    - harbor.${external_domain}
  rules:
    - backendRefs:
        - kind: Service
          name: harbor
          port: 80
      # OCI blob pushes are large, chunked PATCH/PUT requests — same long timeouts
      # image-factory's own route sets. See ADR-0008 decision 5: whether Envoy/Cilium
      # need an additional body-size policy beyond this is an open spike, not
      # resolved here.
      timeouts:
        request: 5m
        backendRequest: 5m
