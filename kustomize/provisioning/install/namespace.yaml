apiVersion: v1
kind: Namespace
metadata:
  name: provisioning
  labels:
    # privileged, not baseline: omni's pod runs its own WireGuard interface for
    # SideroLink (NET_ADMIN, a /dev/net/tun hostPath mount), neither of which
    # baseline allows. Shared with the image-factory workload, which needs nothing
    # past baseline itself.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    use-custom-ca: "true"
