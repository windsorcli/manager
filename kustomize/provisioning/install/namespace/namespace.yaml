apiVersion: v1
kind: Namespace
metadata:
  name: provisioning
  labels:
    # privileged, not baseline: omni's WireGuard pod needs NET_ADMIN and a /dev/net/tun hostPath mount.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    use-custom-ca: "true"
