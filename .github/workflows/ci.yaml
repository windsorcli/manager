# =============================================================================
# CI workflow
# =============================================================================
# Runs on push-to-main, tagged releases, PRs against main, and manual dispatch.
# Manual dispatch runs against any branch — useful for a stacked PR, since the
# pull_request trigger only fires for PRs based on main.
#   code-checks — yamllint, shellcheck, terraform fmt, checkov
#   tests       — terraform module tests, blueprint facet tests, prometheus rules
#   integration — brings a local cluster up on the composed blueprint and tears it down
#   publish     — pushes the OCI bundle on main and tag pushes (gated on integration)
#
# Runner prep, tool installs, and OCI publish come from Core's composite actions
# (windsorcli/core/.github/actions/*), so the pinned tool versions live in Core and a bump
# reaches every downstream blueprint at once. They are referenced at @main alongside the
# Windsor CLI (windsorcli/action@main); pin both to a tag together at release.
#
# The Windsor CLI itself is installed from windsorcli/action at ref main rather than a
# release. Pin to a tag only once one carries windsorcli/cli#3042, #3048 and #3057. The
# first two are what let this blueprint compose at all; pinning back past #3057 would
# reintroduce a cleartext leak of the signing key under `windsor up --verbose`.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  WINDSOR_PROJECT_ROOT: ${{ github.workspace }}
  DOCKER_HOST: unix:///var/run/docker.sock

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ===========================================================================
  # Code Quality
  # ===========================================================================
  code-checks:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Run yamllint
        run: |
          pip install yamllint
          yamllint .

      - name: Run shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shell_files=$(find . -name "*.sh" -print)
          if [ -n "$shell_files" ]; then
            echo "$shell_files" | xargs shellcheck
          else
            echo "No shell scripts found to check"
          fi

      - name: Setup tools
        uses: windsorcli/core/.github/actions/setup-tools@main
        with:
          tools: terraform

      - name: Run terraform fmt
        run: terraform fmt -check -recursive

      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12.3119.0
        with:
          directory: ./terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif

  # ===========================================================================
  # Tests
  # ===========================================================================
  # Terraform module tests, blueprint facet tests, and PrometheusRule unit tests.
  # None of these ran in CI before: the lefthook pre-push hook is globbed to
  # *.tf/*.tfvars, so a facet or test change — every YAML-only change — pushed with
  # nothing run at all.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # task test runs the terraform module tests (terraform), the blueprint facet tests
      # (windsor CLI), the PrometheusRule unit tests (yq + promtool), and the kustomize
      # build check (kustomize).
      - name: Setup tools
        uses: windsorcli/core/.github/actions/setup-tools@main
        with:
          tools: terraform,task,yq,promtool,kustomize

      - name: Install Windsor CLI
        uses: windsorcli/action@main
        with:
          ref: main
          context: local

      - name: Run Tests
        run: task test

  # ===========================================================================
  # Integration
  # ===========================================================================
  # Brings the composed blueprint up on a local Talos cluster in Docker and tears it down.
  # Manager layers on core:latest, so this is also the only check that the published Core
  # artifact and these facets still compose. Split across a matrix so each heavy stack gets
  # its own runner: `provisioning` (image factory + omni + Keycloak) and `registry` (Harbor
  # plus its CNPG database) never contend for one machine.
  integration:
    name: Integration (${{ matrix.scenario.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.scenario.job_timeout }}
    # Job-level block replaces the workflow-level one outright rather than merging —
    # issues: write is only needed here, to post the Claude diagnosis comment below.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        scenario:
          # up_timeout carries Keycloak's cold-start (see addon-provisioning); registry is
          # lighter but Harbor's chart and CNPG still need room.
          - name: provisioning
            sets: --set provisioning.enabled=true
            up_timeout: 35
            job_timeout: 55
          - name: registry
            sets: --set registry.enabled=true
            up_timeout: 25
            job_timeout: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # br_netfilter, disk reclaim, and the Docker data-root relocation the cluster needs.
      - name: Prepare runner
        uses: windsorcli/core/.github/actions/prepare-runner@main

      - name: Setup tools
        uses: windsorcli/core/.github/actions/setup-tools@main
        with:
          tools: terraform,kubectl,flux

      - name: Install Windsor CLI
        uses: windsorcli/action@main
        with:
          ref: main
          context: local

      # Windsor's registry mirrors write pulled layers here, so a warm cache saves the
      # cluster re-pulling k8s, Cilium and the image-factory images on every run. The
      # directory has to exist before actions/cache restores into it.
      - name: Create docker cache directory
        run: mkdir -p .windsor/cache/docker

      - name: Cache docker cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .windsor/cache/docker
          key: docker-cache-${{ runner.os }}-${{ matrix.scenario.name }}-${{ github.sha }}
          restore-keys: |
            docker-cache-${{ runner.os }}-${{ matrix.scenario.name }}-

      # Both capabilities are off by default, so without --set this would bring up a bare
      # Core cluster and assert nothing about what this repo adds. dns.domain matches what the
      # add-ons' routes publish under; see addon-provisioning.yaml / addon-registry.yaml for
      # what each scenario's --set fans on.
      - name: Windsor Init
        run: |
          windsor init local --reset \
            --set dns.domain=test \
            ${{ matrix.scenario.sets }}

      - name: Show blueprint
        run: windsor show blueprint

      - name: Windsor Up
        id: windsor_up
        timeout-minutes: ${{ matrix.scenario.up_timeout }}
        run: windsor up --verbose --wait

      # windsor up --wait already blocks on each Kustomization's Ready condition, which Flux
      # only reports once every resource it applies passes kstatus health — Deployments
      # rolled out, Jobs Complete. Re-checking rollout status here would just re-assert what
      # getting past --wait already proved. What --wait can't prove is that the saml-client
      # Job did the right thing rather than merely exiting 0, so check that explicitly.
      - name: Verify the omni SAML client registered
        if: success() && matrix.scenario.name == 'provisioning'
        run: |
          kubectl -n provisioning wait --for=condition=complete job/keycloak-omni-saml-client --timeout=5m
          # The Job retries pods while Keycloak cold-starts; read every pod's logs, since
          # `logs job/...` picks one arbitrary attempt that may be a failed early one.
          kubectl -n provisioning logs -l batch.kubernetes.io/job-name=keycloak-omni-saml-client --tail=-1 \
            | grep -qE 'registered omni saml client|already registered'

      # windsor up --wait proves the Harbor pods rolled out; what it can't prove is that the
      # gateway accepted the route and resolved its backend, which is what makes harbor.<domain>
      # actually reachable. Assert both parent conditions across the HTTPRoute (driver-agnostic;
      # an external curl would depend on runner->LoadBalancer routing this doesn't guarantee).
      - name: Verify Harbor is reachable through the gateway
        if: success() && matrix.scenario.name == 'registry'
        run: |
          for _ in $(seq 30); do
            conds=$(kubectl -n registry get httproute harbor \
              -o jsonpath='{.status.parents[*].conditions[?(@.type=="Accepted")].status} {.status.parents[*].conditions[?(@.type=="ResolvedRefs")].status}' 2>/dev/null || true)
            case "$conds" in
              *False*|*Unknown*|" "|"") sleep 5 ;;
              *True*) echo "harbor route programmed: $conds"; exit 0 ;;
              *) sleep 5 ;;
            esac
          done
          echo "harbor HTTPRoute not programmed by the gateway (Accepted/ResolvedRefs): '$conds'" >&2
          kubectl -n registry get httproute harbor -o yaml >&2 || true
          exit 1

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get kustomizations -A || true
          kubectl get helmreleases -A || true
          kubectl -n provisioning get events --sort-by=.lastTimestamp || true
          kubectl -n provisioning describe pods || true
          kubectl -n provisioning logs -l app.kubernetes.io/name=image-factory --tail=200 || true
          kubectl -n provisioning logs -l app.kubernetes.io/name=registry --tail=200 || true
          kubectl -n system-identity get events --sort-by=.lastTimestamp || true
          kubectl -n system-identity describe pods || true
          kubectl -n provisioning logs job/keycloak-omni-saml-client --tail=200 || true
          kubectl -n registry get events --sort-by=.lastTimestamp || true
          kubectl -n registry describe pods || true
          kubectl -n registry get httproute harbor -o yaml || true
          kubectl -n registry logs -l app.kubernetes.io/name=harbor --tail=200 || true
          flux get all -A || true

      # -----------------------------------------------------------------------
      # Claude investigation (read-only, first-push-only)
      # -----------------------------------------------------------------------
      # A cheap bash orientation glance, then Claude investigates the LIVE
      # cluster interactively (it's still up at this point, ahead of Windsor
      # Down) until it finds root cause, then a deterministic publish. Gated on
      # the PR-open event so it runs at most once per PR — a rebase is a
      # `synchronize` event and is never eligible, and a breaking change
      # rebased into many open PRs cannot trigger a storm.
      - name: Collect cluster glance
        id: seed
        if: failure() && github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          SEED=/tmp/cluster-glance.txt
          {
            echo "# Kustomizations"
            kubectl get kustomizations -A 2>&1 || true
            echo
            echo "# HelmReleases"
            kubectl get helmreleases -A 2>&1 || true
            echo
            echo "# Pods not Running/Succeeded"
            kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded 2>&1 || true
            echo
            echo "# Recent Warning events"
            kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp 2>&1 | tail -n 30 || true
          } > "$SEED" 2>&1
          echo "Wrote $(wc -l < "$SEED") lines to $SEED"

      - name: Investigate failure with Claude
        if: always() && steps.seed.outcome == 'success' && github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCENARIO: ${{ matrix.scenario.name }}
          DIAGNOSIS_MARKER: "<!-- claude-integration-${{ matrix.scenario.name }}-diagnosis -->"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "renovate"
          prompt: |
            The integration test just failed and the local Windsor cluster is
            STILL RUNNING on this runner — you can inspect it live. Investigate
            it directly and keep going until you have found the actual root
            cause, then write your diagnosis.

            ## Context — scenario

            SCENARIO=`$SCENARIO`:
              - `provisioning` — brings up Image Factory, Omni, and Keycloak.
                                 Verifies the omni saml-client Job registered.
              - `registry`     — brings up Harbor and its CNPG database.
                                 Verifies the harbor HTTPRoute is programmed.

            ## How to investigate

            Start by reading the orientation glance: `cat
            /tmp/cluster-glance.txt`. It lists what's red (flux kustomizations,
            helmreleases, non-running pods, recent Warning events). It is only
            a starting point — not the answer.

            From there, investigate the live cluster yourself with plain
            `kubectl` (no wrapper needed in this repo). Follow the failure
            down its causal chain until you can name the specific broken
            object and *why* it broke — e.g. a red Kustomization → the
            HelmRelease or objects it owns → the pods → their logs
            (`kubectl logs`, add `--previous` for crash-loopers) → the events →
            the source it reconciles from. Do not stop at the first symptom;
            distinguish the true root cause from downstream casualties. Prefer
            targeted, tailed output over dumping full YAML, and don't inspect
            healthy resources.

            This is READ-ONLY. Do NOT apply, delete, edit, restart, scale, or
            otherwise mutate the cluster — inspect only.

            ## Write early, refine as you go

            As soon as you have a working hypothesis, write `/tmp/diagnosis.md`
            in the format below, then keep updating it in place as you confirm
            or revise. If this step is cut short, whatever is in the file is
            what ships — so never leave it empty once you have any signal.

            ## Diagnosis format (write to /tmp/diagnosis.md)

              $DIAGNOSIS_MARKER
              > [!CAUTION]
              >
              > ## 🩺 Integration diagnosis — scenario: `$SCENARIO`
              >
              > **Commit:** `<short SHA of COMMIT_SHA>` · **Run:** [#$RUN_ID]($RUN_URL)
              >
              > **Likely cause:** {one sentence}
              >
              > **Evidence:** {2-4 sentences citing the specific resource,
              > condition, and log snippet that points at the cause. Quote log
              > lines inline with backticks.}
              >
              > **Suggested next step:** {one actionable sentence}
              <!-- /claude-integration-$SCENARIO-diagnosis -->

            The marker lines are required — a later CI step uses them to anchor
            the published comment. Your only output is `/tmp/diagnosis.md`; do
            NOT post comments, touch the step summary, or write anywhere else.
            A separate CI step publishes the result.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 50
            --allowedTools Read,Write,Bash(cat:*),Bash(kubectl:*),Bash(tail:*),Bash(head:*),Bash(grep:*),Bash(jq:*)
            --disallowedTools WebSearch,WebFetch

      # Deterministic publish. Runs even if the Claude step errored or hit the
      # turn cap, so a cut-short investigation still ships whatever it wrote —
      # or a stub pointing at the run. Never charges tokens.
      - name: Publish diagnosis
        if: always() && steps.seed.outcome == 'success' && github.event_name == 'pull_request' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCENARIO: ${{ matrix.scenario.name }}
          MARKER: "<!-- claude-integration-${{ matrix.scenario.name }}-diagnosis -->"
          END_MARKER: "<!-- /claude-integration-${{ matrix.scenario.name }}-diagnosis -->"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DIAG=/tmp/diagnosis.md
          if [ ! -s "$DIAG" ]; then
            printf '%s\n' \
              "$MARKER" \
              "> [!CAUTION]" \
              ">" \
              "> ## 🩺 Integration diagnosis — scenario: \`$SCENARIO\`" \
              ">" \
              "> Automated inspection did not complete. See the [run]($RUN_URL) for manual triage." \
              "$END_MARKER" > "$DIAG"
          fi
          {
            echo "## Integration diagnosis — scenario: $SCENARIO"
            cat "$DIAG"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            EXISTING_ID=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)
            if [ -n "$EXISTING_ID" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$EXISTING_ID" \
                --field body=@"$DIAG"
            else
              gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
                --field body=@"$DIAG"
            fi
          fi

      - name: Windsor Down
        if: always()
        run: |
          windsor destroy --confirm local || true
          windsor down || true

  # ===========================================================================
  # Publish OCI Package
  # ===========================================================================
  # Gated on successful integration. Pushes the Windsor bundle to GHCR under the current
  # ref (tag name or "latest" on main). This is the artifact downstream blueprints layer
  # on, the same way this repo layers on oci://ghcr.io/windsorcli/core:latest.
  publish:
    name: Publish OCI Package
    runs-on: ubuntu-latest
    needs: integration
    if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && needs.integration.result == 'success'
    # packages: write lives here, not at the workflow level, so only this job can push to
    # GHCR — the earlier jobs never hold the token that could push or delete a package.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: windsorcli/core/.github/actions/setup-tools@main
        with:
          tools: terraform

      - name: Install Windsor CLI
        uses: windsorcli/action@main
        with:
          ref: main
          context: local

      - name: Publish OCI package
        uses: windsorcli/core/.github/actions/publish-oci@main
        with:
          image: ghcr.io/windsorcli/manager
          token: ${{ secrets.GITHUB_TOKEN }}
