# addon-registry.yaml facet tests
# Covers the enabled/disabled gate, the required admin password and gateway, the
# database fan-on, storage landing on a PVC vs an object-store bucket, the terraform
# bucket provisioning on hetzner/aws, and the SSO wiring.

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

  gateway: &default-gateway
    enabled: true
    driver: envoy

cases:
  # Baseline: dev mode supplies the admin password fallback, no object store resolves
  # so storage lands on a PVC.
  - name: installs harbor with a pvc-backed registry in dev mode
    values:
      dev: true
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      registry:
        enabled: true
    expect:
      flux:
        - name: registry
          dependsOn:
            - pki-install
            - database-install
            - gateway-install
          install:
            components:
              - database
              - harbor
            substitutions:
              harbor_hostname: harbor.test
              harbor_storage_class: single
              harbor_registry_size: 20Gi
            timeout: 15m
            interval: 5m
          resources:
            - dependsOn:
                - gateway-resources
              components:
                - harbor/gateway
      config:
        database:
          postgres:
            enabled: true

  # SSO rides on identity: enabling it adds a named oidc resources variant. Harbor's own
  # install keeps its dependencies free of identity so its route comes up regardless.
  - name: wires harbor sso when identity is enabled
    values:
      dev: true
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      identity:
        enabled: true
      registry:
        enabled: true
    expect:
      flux:
        - name: registry
          dependsOn:
            - pki-install
            - database-install
            - gateway-install
          install:
            components:
              - database
              - harbor
          resources:
            - components:
                - harbor/gateway
            - name: oidc
              dependsOn:
                - registry-install
                - identity-resources
              components:
                - harbor/oidc
              substitutions:
                keycloak_realm: platform
                oidc_admin_group: platform-admins

  # Outside dev, with no bootstrap admin password supplied, identity falls back to
  # Core's own operator-generated keycloak-initial-admin secret, and cert
  # verification stays on — the opposite branch from the dev-mode case above.
  - name: wires harbor sso outside dev with cert verification on
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      identity:
        enabled: true
      registry:
        enabled: true
        harbor:
          admin_password: supplied-by-operator
    expect:
      flux:
        - name: registry
          resources:
            - components:
                - harbor/gateway
            - name: oidc
              components:
                - harbor/oidc
              substitutions:
                keycloak_admin_secret: keycloak-initial-admin
                oidc_verify_cert: "true"

  # identity present but SSO explicitly opted out keeps Harbor on local-admin auth — no
  # oidc resources variant at all.
  - name: leaves harbor sso out when opted out
    values:
      dev: true
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      identity:
        enabled: true
      registry:
        enabled: true
        harbor:
          sso: false
    expect:
      flux:
        - name: registry
          install:
            components:
              - database
              - harbor
          resources:
            - components:
                - harbor/gateway
    exclude:
      flux:
        - name: registry
          resources:
            - components:
                - harbor/oidc

  # An external OIDC issuer hosts nothing to register against and creates no
  # identity-resources — the oidc variant has to stay off, not dangle a dependsOn
  # on a Kustomization that will never exist.
  - name: leaves harbor sso out when identity is an external oidc issuer
    values:
      dev: true
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      identity:
        enabled: true
        driver: oidc
        oidc:
          issuer: https://sso.corp/realms/platform
      observability:
        enabled: false
      registry:
        enabled: true
    expect:
      flux:
        - name: registry
          install:
            components:
              - database
              - harbor
          resources:
            - components:
                - harbor/gateway
    exclude:
      flux:
        - name: registry
          resources:
            - components:
                - harbor/oidc

  # NOTE: no test for identity.enabled + gateway.enabled: false here yet — Core's
  # keycloak/gateway route (unrelated to this facet) still dangles a dependsOn on
  # gateway-resources against the currently-published core:latest, independent of
  # Harbor entirely. Add once windsorcli/core#2675 merges and republishes.

  # driver defaults to harbor, so leaving it unset still resolves.
  - name: defaults the driver to harbor
    values:
      dev: true
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      registry:
        enabled: true
    expect:
      flux:
        - name: registry

  # Operator-supplied admin password flows through as the secret's value.
  - name: honors an explicit admin password
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      registry:
        enabled: true
        harbor:
          admin_password: supplied-by-operator
    expect:
      flux:
        - name: registry
          install:
            components:
              - database
              - harbor

  # Explicit hostname override flows through the install-tier substitution.
  - name: honors an explicit hostname
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      registry:
        enabled: true
        harbor:
          admin_password: supplied-by-operator
          hostname: registry.fleet.example.com
    expect:
      flux:
        - name: registry
          install:
            substitutions:
              harbor_hostname: registry.fleet.example.com

  # A platform with its own object storage needs no addon to reach s3, and the
  # bucket name has to match the one the terraform block provisions.
  - name: derives the bucket, region, and endpoint from the platform on hetzner
    env:
      HETZNER_S3_ACCESS_KEY: test-access
      HETZNER_S3_SECRET_KEY: test-secret
    values:
      id: tst1
      platform: hetzner
      hetzner:
        token: dummy-token
        location: fsn1
        network_zone: eu-central
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      registry:
        enabled: true
        harbor:
          admin_password: supplied-by-operator
    expect:
      terraform:
        - name: harbor-object-store
          path: object-store/hetzner
          inputs:
            location: fsn1
            force_destroy: "false"
            buckets:
              - windsor-tst1-harbor
      flux:
        - name: registry
          install:
            components:
              - database
              - harbor
              - harbor/s3
            substitutions:
              harbor_registry_bucket: windsor-tst1-harbor
              harbor_registry_region: fsn1
              harbor_registry_endpoint: https://fsn1.your-objectstorage.com

  # Harbor as the only S3 consumer on hetzner without credentials: the shared
  # object-store requires: guard must fire even when image-factory is off.
  - name: fails without hetzner credentials when harbor is the only s3 consumer
    values:
      id: tst1
      platform: hetzner
      hetzner:
        token: dummy-token
        location: fsn1
        network_zone: eu-central
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      registry:
        enabled: true
        harbor:
          admin_password: supplied-by-operator
    expectError: true

  # Same shape as the hetzner case above, on the platform where object storage needs
  # no addon to reach s3.
  - name: derives the bucket, region, and endpoint from the platform on aws
    values:
      id: tst1
      platform: aws
      network: *default-network
      cluster: *default-cluster
      aws:
        region: us-west-2
      gateway: *default-gateway
      registry:
        enabled: true
        harbor:
          admin_password: supplied-by-operator
    expect:
      terraform:
        - name: harbor-object-store
          path: object-store/aws
          inputs:
            force_destroy: "false"
            buckets:
              - windsor-tst1-harbor
      flux:
        - name: registry
          install:
            components:
              - database
              - harbor
              - harbor/s3
            substitutions:
              harbor_registry_bucket: windsor-tst1-harbor
              harbor_registry_region: us-west-2
              harbor_registry_endpoint: https://s3.us-west-2.amazonaws.com

  # Unlike identity (which can run driver: oidc with no local Postgres at all),
  # Harbor has no driver that skips its database — an explicit opt-out here is a
  # genuinely self-contradicting configuration (enable Harbor, forbid the database
  # it unconditionally needs), so it fails composition rather than silently
  # surviving the way identity's own database opt-out test does.
  - name: fails when the database is explicitly disabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      registry:
        enabled: true
        harbor:
          admin_password: supplied-by-operator
      database:
        postgres:
          enabled: false
    expectError: true

  # Missing the admin password fails composition outside dev mode.
  - name: fails without an admin password
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      registry:
        enabled: true
    expectError: true

  # No gateway needed to install — Harbor still comes up (port-forward the harbor
  # Service to reach it), just without the HTTPRoute resources variant.
  - name: installs without a route when no gateway is enabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway:
        enabled: false
      registry:
        enabled: true
        harbor:
          admin_password: supplied-by-operator
    expect:
      flux:
        - name: registry
          dependsOn:
            - pki-install
            - database-install
          install:
            components:
              - database
              - harbor
          resources: []
    exclude:
      flux:
        - name: registry
          resources:
            - components:
                - harbor/gateway

  # Off by default.
  - name: excludes harbor when the addon is disabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway: *default-gateway
      registry:
        enabled: false
    expect:
      flux: []
