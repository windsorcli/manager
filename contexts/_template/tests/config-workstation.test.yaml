# config-workstation.yaml facet tests
# Covers the VM-backed runtime CPU quota bump (colima, docker-desktop): the per-addon
# sizing formula and the workstation.runtime guard -- including that plain "docker"
# (bare-metal Linux dev machines and CI runners, whose real CPU budget this facet
# cannot see) is excluded, not just docker-desktop/colima included.

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

  terraformOutputs: &docker-outputs
    compute:
      controlplanes:
        - endpoint: 10.5.0.10:6443
          node: 10.5.0.10
          hostname: controlplane-1
      workers: []
    workstation: {}

cases:
  # provisioning + registry together: base 5 plus one core each.
  - name: sizes cpu for the full fleet on docker-desktop
    values:
      dev: true
      platform: docker
      network: *default-network
      cluster: *default-cluster
      workstation:
        runtime: docker-desktop
      identity:
        enabled: true
      provisioning:
        enabled: true
      registry:
        enabled: true
    terraformOutputs: *docker-outputs
    expect:
      config:
        cluster:
          controlplanes:
            cpu: "7"

  # colima is just as workerless-single-node as docker-desktop -- same bump applies.
  - name: sizes cpu for the full fleet on colima
    values:
      dev: true
      platform: docker
      network: *default-network
      cluster: *default-cluster
      workstation:
        runtime: colima
      identity:
        enabled: true
      provisioning:
        enabled: true
      registry:
        enabled: true
    terraformOutputs: *docker-outputs
    expect:
      config:
        cluster:
          controlplanes:
            cpu: "7"

  # Plain "docker" (a CI runner, or a bare-metal Linux dev machine) has a fixed,
  # sometimes much smaller CPU budget than a VM-backed runtime -- the bump has to stay
  # off. A 4-core CI runner hit exactly this: the unrestricted (workstation.runtime != '')
  # guard fired here too and requested more CPU than the runner had.
  - name: leaves the cpu quota alone on plain docker
    values:
      dev: true
      platform: docker
      network: *default-network
      cluster: *default-cluster
      workstation:
        runtime: docker
      identity:
        enabled: true
      provisioning:
        enabled: true
      registry:
        enabled: true
    terraformOutputs: *docker-outputs
    exclude:
      config:
        cluster:
          controlplanes:
            cpu: "7"

  # One addon lands at base 5 plus a single core.
  - name: sizes cpu for registry alone on docker-desktop
    values:
      dev: true
      platform: docker
      network: *default-network
      cluster: *default-cluster
      workstation:
        runtime: docker-desktop
      registry:
        enabled: true
    terraformOutputs: *docker-outputs
    expect:
      config:
        cluster:
          controlplanes:
            cpu: "6"

  - name: sizes cpu for provisioning alone on docker-desktop
    values:
      dev: true
      platform: docker
      network: *default-network
      cluster: *default-cluster
      workstation:
        runtime: docker-desktop
      identity:
        enabled: true
      provisioning:
        enabled: true
    terraformOutputs: *docker-outputs
    expect:
      config:
        cluster:
          controlplanes:
            cpu: "6"

  # Neither addon enabled: the facet stays inert and Core's own default holds.
  - name: leaves the cpu quota alone with neither addon enabled
    values:
      dev: true
      platform: docker
      network: *default-network
      cluster: *default-cluster
      workstation:
        runtime: docker-desktop
      identity:
        enabled: true
    terraformOutputs: *docker-outputs
    # cpu: 4 is Core's own schema default, applied later at terraform-input resolution --
    # it never appears in the config: scope itself, so there's nothing to assert it equals.
    # What this proves instead: the facet's own base formula (5, with neither addon's +1)
    # never fired.
    exclude:
      config:
        cluster:
          controlplanes:
            cpu: "5"

  # An operator's explicit quota wins over the computed bump.
  - name: an explicit cpu quota is not overridden
    values:
      dev: true
      platform: docker
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          cpu: 3
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
        workers:
          volumes:
            - /var/mnt/local
      workstation:
        runtime: docker-desktop
      provisioning:
        enabled: true
      registry:
        enabled: true
    terraformOutputs: *docker-outputs
    expect:
      config:
        cluster:
          controlplanes:
            cpu: "3"

  # A worker pool runs the workloads, so the control-plane quota is left at Core's default.
  - name: leaves the control-plane quota alone when a worker pool exists
    values:
      dev: true
      platform: docker
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
        workers:
          count: 1
          volumes:
            - /var/mnt/local
      workstation:
        runtime: docker-desktop
      provisioning:
        enabled: true
      registry:
        enabled: true
    terraformOutputs: *docker-outputs
    # Same reasoning as the case above: proves the facet's fully-bumped value (7, both
    # addons) never fired, rather than asserting Core's schema default directly.
    exclude:
      config:
        cluster:
          controlplanes:
            cpu: "7"
