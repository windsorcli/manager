$schema: https://json-schema.org/draft/2020-12/schema
title: Windsor Manager Blueprint Configuration Schema
description: Manager-specific configuration, merged with the schema Core contributes through the core source.
type: object

# Core's schema arrives with the `core` source and merges into this one, so every
# platform, cluster, network, and addons key Core defines is already available in a
# Manager context without being restated here. This file carries only what Manager
# itself adds.
#
# Rules that matter when adding keys, from the merge in
# pkg/runtime/config/schema_merge.go:
#
#   - Fragments deep-merge and `properties` union recursively, but only where both
#     sides declare `type: object`. Adding a new sibling under an existing Core
#     block — a new entry under `addons`, say — merges cleanly and still satisfies
#     Core's `additionalProperties: false`.
#
#   - Do not redeclare a key Core owns. A duplicate declaration is a second
#     source of truth for the same key. To change a Core default, enum, or
#     description, change it in Core.
#
#   - Do not define `$defs`. Unlike `properties`, `$defs` is replaced wholesale
#     rather than merged, so one side's definitions supplant the other's and any
#     `$ref` pointing at the losing set dangles. Reference Core's instead
#     (`$ref: '#/$defs/dnsHostname'` and friends) or inline the constraint.
#
#   - Watch for names Core already uses in another sense. Core's `secrets` block is
#     the set of providers backing build-time `secret()` references, not an
#     in-cluster secrets backend; a management-side store needs its own key rather
#     than an extra property there.

properties:

  # Sibling of Core's enabled/driver on the same block. Nested under minio, not a flat
  # sibling of driver, because config-object-store.yaml computes its own flat driver and
  # endpoint on this same object_store key — a raw operator field of the same name would
  # collide with that computed value.
  object_store:
    type: object
    properties:
      minio:
        type: object
        properties:
          endpoint:
            type: string
            description: S3 endpoint of the MinIO Tenant serving buckets. Core's addon installs the operator but creates no Tenant, so on platforms with no managed object storage this has to be given explicitly.
        additionalProperties: false

  # Self-hosted Talos image/schematic generation. Independently enable-able — a single
  # cluster wanting air-gapped, version-pinned Talos assets needs this without needing
  # provisioning. config-provisioning.yaml fans this on as a dependency, the same way
  # Core's identity turns on its database.
  image_factory:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Enable the self-hosted Talos image factory.
      external_url:
        type: string
        description: Base URL the factory publishes in download links and installer references. Derived from the domain when unset; set it where the gateway is reached on a non-standard port or through another name.
      registry_size:
        type: string
        default: 10Gi
        description: Size of the volume backing the in-cluster registry, where no object storage exists. Holds schematics and cached boot assets.
      max_concurrency:
        type: integer
        minimum: 1
        default: 6
        description: Simultaneous asset builds. Each build is CPU-heavy; raise it with the node pool, not ahead of it.
      min_talos_version:
        type: string
        default: "1.2.0"
        description: Oldest Talos release the factory will generate assets for.
      cache_signing_key:
        type: string
        sensitive: true
        description: ECDSA private key used to sign cached boot assets so nodes can verify what the factory serves. Generate with `openssl ecparam -name prime256v1 -genkey -noout`. Set via a secret() reference.
      registry:
        type: object
        properties:
          schematic:
            type: object
            properties:
              registry:
                type: string
                description: OCI registry the factory writes generated schematics to. It needs push access; this is not a mirror.
              namespace:
                type: string
                default: siderolabs/image-factory
                description: Repository path prefix for schematics.
              repository:
                type: string
                default: schematics
                description: Repository name for schematics.
              insecure:
                type: boolean
                default: false
                description: Allow HTTP or invalid TLS to the schematic registry.
            additionalProperties: false
        additionalProperties: false
        description: Registries the factory reads from and writes to.
    additionalProperties: false
    description: Self-hosted Talos image factory

  # How this fleet provisions and manages downstream clusters. See config-provisioning.yaml 
  # for what enabling it turns on.
  provisioning:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Enable the self-hosted Omni management plane and the capabilities it depends on (identity, image factory).
    additionalProperties: false

  # Sibling of Core's location, network_zone, token, and dns_parent_zone.
  hetzner:
    type: object
    properties:
      object_storage:
        type: object
        properties:
          location:
            type: string
            enum:
              - fsn1
              - nbg1
              - hel1
            default: fsn1
            description: Location holding the buckets. Object Storage runs in fsn1, nbg1, and hel1 only, so a cluster in ash, hil, or sin reaches its buckets across regions.
          access_key:
            type: string
            sensitive: true
            description: S3 access key for the Hetzner project. Generated in the Hetzner console; there is no API to create one. Set via a secret() reference.
          secret_key:
            type: string
            sensitive: true
            description: S3 secret key paired with access_key. Set via a secret() reference.
        additionalProperties: false
        description: Hetzner Object Storage credentials

# Root stays open. `windsor test` loads this file alone without merging the schemas its
# sources contribute, so `additionalProperties: false` here rejects every Core key.
# Core closes its own root, and that survives the merge in a normal composition.
