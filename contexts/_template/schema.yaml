$schema: https://json-schema.org/draft/2020-12/schema
title: Windsor Manager Blueprint Configuration Schema
description: Manager-specific configuration, merged with the schema Core contributes through the core source.
type: object

# Core's schema arrives with the `core` source and merges into this one, so every
# platform, cluster, network, and addons key Core defines is already available in a
# Manager context without being restated here. This file carries only what Manager
# itself adds.
#
# Rules that matter when adding keys, from the merge in
# pkg/runtime/config/schema_merge.go:
#
#   - Fragments deep-merge and `properties` union recursively, but only where both
#     sides declare `type: object`. Adding a new sibling under an existing Core
#     block — a new entry under `addons`, say — merges cleanly and still satisfies
#     Core's `additionalProperties: false`.
#
#   - Do not redeclare a key Core owns. A duplicate declaration is a second
#     source of truth for the same key. To change a Core default, enum, or
#     description, change it in Core.
#
#   - Do not define `$defs`. Unlike `properties`, `$defs` is replaced wholesale
#     rather than merged, so one side's definitions supplant the other's and any
#     `$ref` pointing at the losing set dangles. Reference Core's instead
#     (`$ref: '#/$defs/dnsHostname'` and friends) or inline the constraint.
#
#   - Watch for names Core already uses in another sense. Core's `secrets` block is
#     the set of providers backing build-time `secret()` references, not an
#     in-cluster secrets backend; a management-side store needs its own key rather
#     than an extra property there.

properties:

  # Object storage backing every in-cluster registry that needs bucket-backed storage —
  # image_factory's cache and harbor's own image store, each in its own bucket (see
  # config-object-store.yaml). Nested under minio, not a flat sibling of driver, because
  # config-object-store.yaml computes its own driver/endpoint/region/prefix onto this
  # same object_store key — a raw operator field of the same name would collide with
  # that computed value. This is a separate tree from Core's own flat
  # object_store.enabled/driver (its minio operator toggle); config-object-store.yaml
  # reads that one to decide whether minio is available, but writes its own resolution
  # here. More than one consumer reads this, so it stays a top-level key rather than
  # nesting under either consumer.
  object_store:
    type: object
    properties:
      minio:
        type: object
        properties:
          endpoint:
            type: string
            description: S3 endpoint of the MinIO Tenant serving buckets. Core's addon installs the operator but creates no Tenant, so on platforms with no managed object storage this has to be given explicitly.
        additionalProperties: false

  # Downstream cluster provisioning: the image factory and Omni, grouped under one
  # namespace since both are part of the same provisioning pipeline. `enabled` is the
  # umbrella switch addon-provisioning.yaml's own config: block fans out from (turning
  # on identity and image_factory together); image_factory and omni still toggle
  # independently under it — provisioning.image_factory.enabled works with
  # provisioning.enabled left false, for a single cluster that wants air-gapped,
  # version-pinned Talos assets without fleet-wide provisioning.
  provisioning:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Enable the self-hosted Omni management plane and the capabilities it depends on (identity, image factory).

      # Self-hosted Talos image/schematic generation.
      image_factory:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
            description: Enable the self-hosted Talos image factory.
          external_url:
            type: string
            description: Base URL the factory publishes in download links and installer references. Derived from the domain when unset; set it where the gateway is reached on a non-standard port or through another name.
          max_concurrency:
            type: integer
            minimum: 1
            default: 6
            description: Simultaneous asset builds. Each build is CPU-heavy; raise it with the node pool, not ahead of it.
          min_talos_version:
            type: string
            default: "1.2.0"
            description: Oldest Talos release the factory will generate assets for.
          cache_signing_key:
            type: string
            sensitive: true
            description: ECDSA private key used to sign cached boot assets so nodes can verify what the factory serves. Generate with `openssl ecparam -name prime256v1 -genkey -noout`. Set via a secret() reference.
          registry:
            type: object
            properties:
              schematic:
                type: object
                properties:
                  registry:
                    type: string
                    description: OCI registry the factory writes generated schematics to. It needs push access. Defaults to the registry capability; set this to point at an external registry instead.
                  namespace:
                    type: string
                    default: siderolabs/image-factory
                    description: Repository path prefix for schematics.
                  repository:
                    type: string
                    default: schematics
                    description: Repository name for schematics.
                  insecure:
                    type: boolean
                    default: false
                    description: Allow HTTP or invalid TLS to the schematic registry.
                additionalProperties: false
              installer:
                type: object
                properties:
                  namespace:
                    type: string
                    description: Repository path prefix for installer images. Defaults to the registry capability's own project when unset.
                  repository:
                    type: string
                    default: installer
                    description: Repository name the factory pushes built installer images to, on the same registry as schematic.
                additionalProperties: false
            additionalProperties: false
            description: Registries the factory reads from and writes to.
        additionalProperties: false
        description: Self-hosted Talos image factory

      # Self-hosted Sidero Omni, the fleet's Talos control plane. See
      # addon-provisioning.yaml for the deployment shape (embedded etcd, own TLS,
      # SideroLink, Keycloak SAML).
      omni:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
            description: Enable Sidero Omni on its own, without the image factory. provisioning.enabled turns both on together.
          hostname:
            type: string
            description: Base hostname Omni's UI/API advertises. Derived as omni.<domain> when unset; the Kubernetes proxy and SideroLink machine API endpoints are derived from this same base (kubernetes.<hostname>, siderolink.<hostname>).
          account_id:
            type: string
            description: UUID for config.account.id. Must not change for the lifetime of the installation. Terraform-generated and held in state when unset.
          wireguard:
            type: object
            properties:
              service_type:
                type: string
                enum:
                  - NodePort
                  - LoadBalancer
                description: Kubernetes Service type fronting SideroLink's WireGuard port. Defaults to NodePort on docker-desktop and LoadBalancer everywhere else.
              advertised_endpoint:
                type: string
                description: host:port machines dial for SideroLink, overriding the derived hostname/NodePort. Changing this after machines have joined requires re-provisioning them.
              node_port:
                type: integer
                description: NodePort for the WireGuard Service (chart default 30180). Override on a port conflict; also republishes as the docker-desktop hostport.
            additionalProperties: false
          persistence_size:
            type: string
            default: 16Gi
            description: Size of the volume backing Omni's embedded etcd, secondary SQLite storage, and machine logs.
          etcd_encryption_key:
            type: string
            sensitive: true
            description: ASCII-armored GPG private key Omni uses to decrypt its etcd master key (config.storage.default.etcd.privateKeySource). Generate with `(export GNUPGHOME=$(mktemp -d); gpg --batch --passphrase '' --quick-gen-key x; gpg -a --export-secret-key > omni.asc; rm -rf $GNUPGHOME)`. Set via a secret() reference. Required outside dev mode; dev mode falls back to a fixed key stored in the facet.
          initial_admins:
            type: array
            items:
              type: string
            description: Emails seeded as admins on Omni's first start (config.auth.initialUsers), before Keycloak SAML group membership grants any role. Bootstrap only, not how production access is granted. The chart refuses to start with none at all — required outside dev mode; dev mode seeds a fixed placeholder. Deliberately no default here — a schema default would be materialized ahead of the facet's own null-coalescing fallback, permanently masking the dev-mode default.
          service_account_key:
            type: string
            sensitive: true
            description: Base64-encoded Omni service account key for the omni_exporter Deployment (client.WithServiceAccount). Nothing in this repo can create it — Omni has no non-interactive bootstrap credential, only SAML/WebAuthn/Auth0 login, so an admin has to log in once and run `omnictl serviceaccount create --use-user-role=false --role=Reader omni-exporter`, then set this via a secret() reference. Unset leaves the exporter Deployment out entirely; nothing else in this facet depends on it.
          backup:
            type: object
            properties:
              enabled:
                type: boolean
                default: false
                description: Provision an S3 bucket for Omni's etcd backups. Works only on object_store.driver hetzner or aws. Pointing Omni at the bucket needs a terraform-provider-omni release that does not exist yet.
              force_destroy:
                type: boolean
                default: false
                description: Delete the backup bucket's contents on teardown. Off by default, so teardown blocks until an operator empties the bucket by hand.
            additionalProperties: false
            description: Off-cluster S3 destination bucket for Omni's etcd backups.
        additionalProperties: false
        description: Self-hosted Sidero Omni fleet control plane
    additionalProperties: false

  # Fleet container registry. Capability-plus-driver, the same shape Core's own
  # identity.driver/database.postgres.driver use.
  registry:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Enable the fleet container registry.
      driver:
        type: string
        enum:
          - harbor
          - distribution
        default: distribution
        description: distribution is a bare, anonymous OCI store, the cheap default. harbor is a full-featured self-hosted registry (scanning, RBAC, UI, replication).
      distribution:
        type: object
        description: Bare registry settings (driver distribution)
        properties:
          storage_size:
            type: string
            default: 10Gi
            description: Size of the volume backing the registry, where no object storage exists.
        additionalProperties: false
      harbor:
        type: object
        description: Hosted Harbor settings (driver harbor)
        properties:
          hostname:
            type: string
            description: Base hostname Harbor's UI/API advertises. Derived as harbor.<domain> when unset.
          admin_password:
            type: string
            sensitive: true
            description: Initial password for Harbor's local admin account, used as a fallback sign-in when SSO isn't configured. Set via a secret() reference. Required outside dev mode; dev mode falls back to a fixed password stored in the facet.
          registry_size:
            type: string
            default: 20Gi
            description: Size of the volume backing the in-cluster registry, where no object storage exists. Holds pushed images and charts.
          sso:
            type: boolean
            default: true
            description: Sign in to Harbor via Core's identity (SSO). Active when identity is enabled; set false to keep Harbor on local-admin auth.
          proxy_cache:
            type: array
            default: []
            items:
              type: object
              properties:
                name:
                  type: string
                  description: Harbor project name for this proxy cache, e.g. docker-hub.
                registry_type:
                  type: string
                  enum:
                    - docker-hub
                    - docker-registry
                    - github-ghcr
                    - quay
                    - google-gcr
                    - aws-ecr
                    - azure-acr
                    - jfrog-artifactory
                    - harbor
                  description: Upstream registry provider Harbor pulls through.
                url:
                  type: string
                  description: Upstream registry URL, e.g. https://registry-1.docker.io.
                username:
                  type: string
                  description: Optional upstream credential username. Anonymous pull if unset.
                password:
                  type: string
                  sensitive: true
                  description: Optional upstream credential password or token. Set via a secret() reference.
                public:
                  type: boolean
                  default: false
                  description: Let any signed-in user pull from this project without a role grant.
              required:
                - name
                - registry_type
                - url
              additionalProperties: false
            description: Proxy-cache projects Harbor creates for pull-through caching of upstream registries.
          gc:
            type: object
            properties:
              enabled:
                type: boolean
                default: true
                description: Run Harbor's garbage collection on a schedule. Reclaims blobs no longer referenced by any tag.
              schedule:
                type: string
                default: "0 0 2 * * *"
                description: Cron expression for GC, 6 fields with seconds first (sec min hour day month weekday). Default is daily at 02:00.
              delete_untagged:
                type: boolean
                default: false
                description: Also delete untagged artifacts before reclaiming blobs, not just orphaned blobs under tagged artifacts.
            additionalProperties: false
            description: Harbor's own scheduled garbage collection.
        additionalProperties: false
    additionalProperties: false
    description: Self-hosted fleet container registry

  # Sibling of Core's location, network_zone, token, and dns_parent_zone.
  hetzner:
    type: object
    properties:
      object_storage:
        type: object
        properties:
          location:
            type: string
            enum:
              - fsn1
              - nbg1
              - hel1
            default: fsn1
            description: Location holding the buckets. Object Storage runs in fsn1, nbg1, and hel1 only, so a cluster in ash, hil, or sin reaches its buckets across regions.
          access_key:
            type: string
            sensitive: true
            description: S3 access key for the Hetzner project. Generated in the Hetzner console; there is no API to create one. Set via a secret() reference.
          secret_key:
            type: string
            sensitive: true
            description: S3 secret key paired with access_key. Set via a secret() reference.
        additionalProperties: false
        description: Hetzner Object Storage credentials

# Root stays open. `windsor test` loads this file alone without merging the schemas its
# sources contribute, so `additionalProperties: false` here rejects every Core key.
# Core closes its own root, and that survives the merge in a normal composition.
