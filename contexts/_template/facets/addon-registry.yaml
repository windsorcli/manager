kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: registry
  description: Fleet container registry (harbor or a bare distribution store)

# registry.driver: distribution (cheap, anonymous, the default) or harbor (opt-in,
# full-featured).
when: registry.enabled == true

requires:
  - when: (registry.driver ?? 'distribution') == 'harbor' && dev != true
    paths:
      - registry.harbor.admin_password
    message: Harbor requires a local admin password outside dev mode. Set registry.harbor.admin_password via a secret() reference.

# =============================================================================
# Terraform — object-store buckets
# =============================================================================
# Harbor's bucket disables force_destroy: it holds pushed images, not a cache.
# distribution's bucket keeps the module's own default (force_destroy on): rebuildable.
terraform:

  - name: harbor-object-store
    path: object-store/hetzner
    when: (registry.driver ?? 'distribution') == 'harbor' && object_store.driver == 'hetzner'
    inputs:
      access_key: ${hetzner.object_storage.access_key ?? env("HETZNER_S3_ACCESS_KEY")}
      secret_key: ${hetzner.object_storage.secret_key ?? env("HETZNER_S3_SECRET_KEY")}
      location: "${hetzner.object_storage.location ?? 'fsn1'}"
      force_destroy: false
      buckets:
        - "${object_store.prefix}-harbor"

  - name: harbor-object-store
    path: object-store/aws
    when: (registry.driver ?? 'distribution') == 'harbor' && object_store.driver == 'aws'
    inputs:
      region: ${aws.region}
      force_destroy: false
      buckets:
        - "${object_store.prefix}-harbor"

  - name: registry-distribution-object-store
    path: object-store/hetzner
    when: (registry.driver ?? 'distribution') == 'distribution' && object_store.driver == 'hetzner'
    inputs:
      access_key: ${hetzner.object_storage.access_key ?? env("HETZNER_S3_ACCESS_KEY")}
      secret_key: ${hetzner.object_storage.secret_key ?? env("HETZNER_S3_SECRET_KEY")}
      location: "${hetzner.object_storage.location ?? 'fsn1'}"
      buckets:
        - "${object_store.prefix}-registry"

  - name: registry-distribution-object-store
    path: object-store/aws
    when: (registry.driver ?? 'distribution') == 'distribution' && object_store.driver == 'aws'
    inputs:
      region: ${aws.region}
      buckets:
        - "${object_store.prefix}-registry"

config:
  # The CloudNativePG operator (Core's database facet) is install-only — it manages
  # Cluster CRs but creates none; install/database/database.yaml is the Cluster this
  # facet supplies directly, the same shape Keycloak's own facet uses. An operator's
  # own explicit false still wins (raw values merge over facet-computed config last).
  # driver is re-stated (not just enabled) because addon-database.yaml's own flux
  # entry gates on database.postgres.driver == 'cloudnativepg' with no ?? fallback of
  # its own — the same pattern addon-identity.yaml uses for this exact dependency.
  - name: database
    when: (registry.driver ?? 'distribution') == 'harbor'
    value:
      postgres:
        enabled: true
        driver: "${database.postgres.driver ?? 'cloudnativepg'}"

  # Read by any facet that wants a registry without caring which driver backs it.
  - name: registry_effective
    value:
      driver: "${registry.driver ?? 'distribution'}"
      hostname: >-
        ${(registry.driver ?? 'distribution') == 'harbor'
          ? 'harbor.registry.svc.cluster.local'
          : 'distribution.registry.svc.cluster.local:5000'}
      insecure: true

  - name: harbor_effective
    when: (registry.driver ?? 'distribution') == 'harbor'
    value:
      hostname: >-
        ${registry.harbor.hostname
          ?? ('harbor.' + ((dns.public_domain ?? '') == ''
                ? (dns.private_domain ?? dns.domain ?? '')
                : dns.public_domain))}
      admin_password: >-
        ${(registry.harbor.admin_password ?? '') != '' ? registry.harbor.admin_password :
        (dev == true ? 'harbor-dev-admin-password' : '')}
      # SSO is on when identity hosts Keycloak, unless explicitly turned off. The Job
      # only knows how to talk to Keycloak's admin API (identity.driver: oidc hosts
      # nothing to register against, and creates no identity-resources to depend on).
      # Also needs the gateway: the redirect URI it registers is the hosted server's
      # gateway URL, and Harbor's own route is equally unreachable without one.
      sso: ${identity.enabled == true && (identity.driver ?? 'keycloak') == 'keycloak' && gateway.enabled == true && (registry.harbor.sso ?? true) != false}
      gc: ${(registry.harbor.gc.enabled ?? true) != false}

# =============================================================================
# Flux system — the registry (harbor or distribution, whichever driver is active)
# =============================================================================
# pki-install/database-install apply to harbor only, conditional like gateway-install.
# Named "registry" to match its kustomize path — same relationship Core's own
# "identity" flux system has to the keycloak-specific pieces inside it.
#
flux:

  - name: registry
    dependsOn:
      - "${(registry.driver ?? 'distribution') == 'harbor' ? 'pki-install' : ''}"
      - "${(registry.driver ?? 'distribution') == 'harbor' ? 'database-install' : ''}"
      - "${(registry.driver ?? 'distribution') == 'harbor' && gateway.enabled == true ? 'gateway-install' : ''}"
    secrets:
      harbor-admin-password:
        data:
          HARBOR_ADMIN_PASSWORD: ${harbor_effective.admin_password ?? ''}
      harbor-registry-s3:
        data:
          REGISTRY_STORAGE_S3_ACCESSKEY: ${hetzner.object_storage.access_key ?? env("HETZNER_S3_ACCESS_KEY") ?? ''}
          REGISTRY_STORAGE_S3_SECRETKEY: ${hetzner.object_storage.secret_key ?? env("HETZNER_S3_SECRET_KEY") ?? ''}
      # A Secret, not a ConfigMap, since entries may carry upstream credentials.
      harbor-proxy-cache-config:
        data:
          proxy-cache.yaml: ${yamlString(registry.harbor.proxy_cache ?? [])}
      # Used only by distribution/s3; harmless to materialize otherwise.
      registry-s3:
        data:
          access_key: ${hetzner.object_storage.access_key ?? env("HETZNER_S3_ACCESS_KEY") ?? ''}
          secret_key: ${hetzner.object_storage.secret_key ?? env("HETZNER_S3_SECRET_KEY") ?? ''}
    install:
      components:
        - "${(registry.driver ?? 'distribution') == 'harbor' ? 'database' : ''}"
        - "${(registry.driver ?? 'distribution') == 'harbor' ? 'harbor' : ''}"
        - "${(registry.driver ?? 'distribution') == 'harbor' && (object_store.driver == 'hetzner' || object_store.driver == 'aws') ? 'harbor/s3' : ''}"
        - "${(registry.driver ?? 'distribution') == 'harbor' && (telemetry.metrics.enabled ?? false) == true ? 'harbor/prometheus' : ''}"
        - "${(registry.driver ?? 'distribution') == 'distribution' ? 'distribution' : ''}"
        - "${(registry.driver ?? 'distribution') == 'distribution' && (object_store.driver == 'hetzner' || object_store.driver == 'aws') ? 'distribution/s3' : ''}"
        - "${(registry.driver ?? 'distribution') == 'distribution' && object_store.driver != 'hetzner' && object_store.driver != 'aws' ? 'distribution/pvc' : ''}"
      substitutions:
        harbor_hostname: "${harbor_effective.hostname}${workstation.runtime == 'docker-desktop' ? ':8443' : ''}"
        harbor_storage_class: "${cluster.storage.class ?? 'single'}"
        harbor_registry_size: "${registry.harbor.registry_size ?? '20Gi'}"
        # Used only by the distribution driver's own install/pvc/s3 components.
        registry_storage_class: "${cluster.storage.class ?? 'single'}"
        registry_storage_size: "${registry.distribution.storage_size ?? '10Gi'}"
        registry_replicas: "${topology == 'ha' && (object_store.driver == 'hetzner' || object_store.driver == 'aws') ? 2 : 1}"
        # Matches the bucket name the terraform block above provisions.
        registry_bucket: "${object_store.prefix}-registry"
        registry_region: "${object_store.region ?? ''}"
        registry_endpoint: "${object_store.endpoint ?? ''}"
        # Same expression the terraform block above hands the bucket module, so the
        # registry and the bucket that gets provisioned cannot drift apart.
        harbor_registry_bucket: "${object_store.prefix}-harbor"
        harbor_registry_region: "${object_store.region ?? ''}"
        harbor_registry_endpoint: "${object_store.endpoint ?? ''}"
      timeout: 15m
      interval: 5m
    resources:
      # No hard requires: on gateway.enabled — Harbor's install doesn't need one (the
      # chart's own expose.type stays clusterIP either way), the same posture
      # addon-observability.yaml uses for Grafana. Without a gateway, reach Harbor by
      # port-forwarding the harbor Service in the registry namespace. distribution
      # never gets a route — it has no UI/API worth exposing.
      - when: (registry.driver ?? 'distribution') == 'harbor' && gateway.enabled == true
        dependsOn:
          - gateway-resources
        components:
          - harbor/gateway
        substitutions:
          external_domain: "${(dns.public_domain ?? '') == '' ? (dns.private_domain ?? dns.domain ?? '') : dns.public_domain}"
        timeout: 10m
        interval: 5m

      # Harbor SSO configuration. A named resources variant, not a component of the
      # install tier above, so it depends on identity without gating Harbor's own
      # install or gateway route — the same shape addon-identity.yaml uses to
      # sequence its database resources variant ahead of the Keycloak CR.
      - name: oidc
        when: (registry.driver ?? 'distribution') == 'harbor' && harbor_effective.sso == true
        dependsOn:
          - registry-install
          - identity-resources
        components:
          - harbor/oidc
        substitutions:
          harbor_hostname: "${harbor_effective.hostname}${workstation.runtime == 'docker-desktop' ? ':8443' : ''}"
          keycloak_realm: "${identity_effective.realm}"
          keycloak_admin_secret: "${(identity_effective.admin_password ?? '') != '' ? 'keycloak-bootstrap-admin' : 'keycloak-initial-admin'}"
          oidc_issuer: "${identity_effective.issuer}"
          oidc_admin_group: platform-admins
          oidc_verify_cert: "${dev == true ? false : true}"
        # At least the Job's own activeDeadlineSeconds (40m) — a shorter Flux
        # timeout would give up before Kubernetes ever kills the Job itself.
        timeout: 40m
        interval: 5m

      # Proxy-cache projects. A resources variant, not an install component, for the
      # same reason oidc is: it needs Harbor's own API up, not just the chart applied.
      - name: proxy-cache
        when: (registry.driver ?? 'distribution') == 'harbor' && len(registry.harbor.proxy_cache ?? []) > 0
        dependsOn:
          - registry-install
        components:
          - harbor/proxy-cache
        # At least the Job's own activeDeadlineSeconds (40m).
        timeout: 40m
        interval: 5m

      # Sets Harbor's own GC schedule once; Harbor's jobservice runs it from then on.
      - name: gc
        when: (registry.driver ?? 'distribution') == 'harbor' && harbor_effective.gc == true
        dependsOn:
          - registry-install
        components:
          - harbor/gc
        substitutions:
          gc_schedule: "${registry.harbor.gc.schedule ?? '0 0 2 * * *'}"
          gc_delete_untagged: "${registry.harbor.gc.delete_untagged ?? false}"
        # At least the Job's own activeDeadlineSeconds (40m).
        timeout: 40m
        interval: 5m

      # Gives image factory push credentials for Harbor. provisioning-base-install
      # so the provisioning namespace this Job's RoleBinding targets already exists.
      - name: image-factory-auth
        when: (registry.driver ?? 'distribution') == 'harbor' && provisioning.image_factory.enabled == true
        dependsOn:
          - registry-install
          - provisioning-base-install
        components:
          - harbor/image-factory
        # At least the Job's own activeDeadlineSeconds (40m).
        timeout: 40m
        interval: 5m

  # Both contribute into config-observability.yaml's manager-observability
  # Kustomization rather than owning their own — see that facet's comment for why
  # (name collision risk with Core's own observability/telemetry).
  - name: manager-observability
    when: (registry.driver ?? 'distribution') == 'harbor' && (telemetry.metrics.enabled ?? false) == true
    resources:
      - components:
          - prometheus/alerts/harbor
          - grafana/dashboards/harbor
        timeout: 5m
        interval: 5m

  # ClusterFilter is cluster-scoped and fluent-operator picks it up by label, not by
  # which Kustomization applied it, so this rides in the same shared Kustomization as
  # the alerts/dashboards above rather than needing its own. Gated on the log pipeline
  # actually running fluentd — driver: none ships no aggregator for this to attach to.
  # config-observability.yaml's own manager-observability entry also requires
  # telemetry.metrics.enabled == true, so this stays off if an operator disables
  # metrics while keeping logs on — both default on, so this rarely bites.
  - name: manager-observability
    when: (registry.driver ?? 'distribution') == 'harbor' && (telemetry.logs.enabled ?? true) == true && (telemetry.logs.driver ?? 'fluentd') == 'fluentd'
    resources:
      - components:
          - harbor/log-filter
        timeout: 5m
        interval: 5m
