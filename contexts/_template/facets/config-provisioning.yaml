kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: provisioning
  description: Turns on the capabilities downstream cluster provisioning depends on

# Omni authenticates operators against the cluster identity provider and provisions Talos
# machines from the image factory. `provisioning.enabled` turns both on so an operator sets
# one flag instead of two. Identity is Core's, not Manager's.
#
# Both targets schema-default to `enabled: false`, so an `identity.enabled != false` guard
# here would always read that default back as false. Setting `true` unconditionally instead
# — an operator's own `identity.enabled: false` in values.yaml still wins, since the
# composer merges raw operator values over facet-computed config last each round.
when: provisioning.enabled == true

config:

  # Core's identity facet hosts Keycloak and, through it, the database the server needs.
  - name: identity
    value:
      enabled: true

  - name: image_factory
    value:
      enabled: true
