kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: object-store
  description: Resolves the object storage backend shared by every bucket-backed registry (image_factory, harbor)

# =============================================================================
# Config — effective object store
# =============================================================================
# driver: hetzner and aws provision buckets in the platform's own object storage; minio
# uses Core's in-cluster operator, which installs no Tenant, so its endpoint stays an
# operator input; none means no bucket-backed storage is available. Each consumer
# (addon-provisioning.yaml's image_factory, addon-harbor.yaml) provisions its own bucket
# against this shared driver/endpoint/region/prefix — see ADR-0008 for why the buckets
# themselves stay separate.
config:

  - name: object_store
    value:
      driver: none
      endpoint: ""
      region: ""
      prefix: "windsor-${id}"

  - name: object_store
    when: platform == 'hetzner'
    value:
      driver: hetzner
      # Object Storage runs in fsn1, nbg1, and hel1 only, so its location is set
      # independently of where the servers run.
      endpoint: "https://${hetzner.object_storage.location ?? 'fsn1'}.your-objectstorage.com"
      region: "${hetzner.object_storage.location ?? 'fsn1'}"

  - name: object_store
    when: platform == 'aws'
    value:
      driver: aws
      endpoint: "https://s3.${aws.region}.amazonaws.com"
      region: "${aws.region}"

  # object_store.enabled/driver on the right-hand side here are Core's own raw operator
  # toggle (a flat top-level key there too — see ../core's schema), not Manager's own
  # object_store block on the left: Core's minio operator installs no Tenant, so an
  # endpoint still has to come from Manager's object_store.minio.endpoint below.
  - name: object_store
    when: platform != 'hetzner' && platform != 'aws' && (object_store.enabled ?? false) == true
    value:
      driver: minio
      endpoint: "${object_store.minio.endpoint ?? ''}"
      region: ""

# =============================================================================
# Requires
# =============================================================================
# Gated on any known consumer being enabled — a bare object_store resolution with
# nothing reading it needs neither credentials nor an endpoint.
requires:
  - when: >-
      object_store.driver == 'hetzner' && ((provisioning.image_factory.enabled ?? false) == true || (registry.enabled ?? false) == true)
      && ((env("HETZNER_S3_ACCESS_KEY") ?? '') == '' || (env("HETZNER_S3_SECRET_KEY") ?? '') == '')
    paths:
      - hetzner.object_storage.access_key
      - hetzner.object_storage.secret_key
    message: >-
      Hetzner issues S3 credentials from the console only, so they cannot be provisioned.
      Export HETZNER_S3_ACCESS_KEY and HETZNER_S3_SECRET_KEY, or set both values here.

  - when: object_store.driver == 'minio' && ((provisioning.image_factory.enabled ?? false) == true || (registry.enabled ?? false) == true)
    paths:
      - object_store.minio.endpoint
    message: >-
      Core's object store addon installs the MinIO operator but creates no Tenant, so the
      S3 endpoint of the Tenant serving these buckets has to be given explicitly.
