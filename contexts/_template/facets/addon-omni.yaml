# =============================================================================
# Flux system — Omni
# =============================================================================
# identity-resources because Omni's SAML config points at the platform realm's
# descriptor at startup, and the omni/saml-client Job registers Omni as a client of
# that same realm over the admin REST API.
#
# Conditional components:
#   - omni/prometheus: metrics Service and ServiceMonitor.
#   - omni/exporter: omni_exporter Deployment (siderolabs/omni_exporter), off until
#     omni.service_account_key is set — nothing here can create that key. It's a
#     Reader-role service account, an admin creates by hand after first login
#     (`omnictl serviceaccount create --use-user-role=false --role=Reader
#     omni-exporter`) and hands to Windsor via a secret() reference. Everything past
#     that point — the Deployment, the Secret, the ServiceMonitor — is ordinary Manager
#     automation; only the key itself is unautomatable.
#
flux:

  - name: omni
    dependsOn:
      - identity-resources
    secrets:
      omni-etcd-encryption-key:
        data:
          omni.asc: ${omni_effective.etcd_encryption_key}
      # Empty unless omni.service_account_key is set — harmless either way, since
      # omni/exporter (the only consumer) is excluded from components in that case too.
      omni-service-account-key:
        data:
          key: ${omni.service_account_key ?? ''}
    install:
      components:
        - omni
        - omni/saml-client
        - "${(telemetry.metrics.enabled ?? false) == true ? 'omni/prometheus' : ''}"
        - "${lb_effective.mode == 'nodeport' ? 'omni/nodeport' : ''}"
        - "${lb_effective.mode != 'nodeport' && gateway.driver != 'cilium' ? 'omni/loadbalancer' : ''}"
        - "${(telemetry.metrics.enabled ?? false) == true && (omni.service_account_key ?? '') != '' ? 'omni/exporter' : ''}"
      substitutions:
        omni_account_id: "${omni.account_id ?? terraform_output('omni-account', 'id')}"
        omni_hostname: "${omni_effective.hostname}${omni_effective.external_port_suffix}"
        omni_kube_proxy_hostname: "${omni_effective.kube_proxy_hostname}${omni_effective.external_port_suffix}"
        omni_machine_api_hostname: "${omni_effective.machine_api_hostname}${omni_effective.external_port_suffix}"
        omni_persistence_size: "${omni.persistence_size ?? '16Gi'}"
        omni_persistence_storage_class: "${cluster.storage.class ?? 'single'}"
        # config.registries.imageFactoryBaseURL. This one value serves two
        # purposes in Omni's own client (client/pkg/imagefactory/client.go): its
        # own reconciliation calls, and the download links it hands back to an
        # operator's browser — so it has to be the external, browser-reachable
        # URL, not the in-cluster Service. Falls back to Manager's own image
        # factory when it's enabled, else the chart's public default.
        omni_image_factory_url: "${image_factory.external_url ?? (image_factory.enabled == true ? ('https://factory.' + omni_effective.domain + omni_effective.external_port_suffix) : 'https://factory.talos.dev')}"
        # The chart refuses to start with zero initial users. dev mode seeds
        # Core's own dev admin (keycloak/realm/dev-user), so a SAML login with
        # that same identity is recognized immediately — not a separate,
        # unrelated placeholder identity.
        omni_initial_admins: "${omni.initial_admins ?? (dev == true ? ['admin@local.test'] : [])}"
        omni_wireguard_node_port: "${omni_effective.wireguard_node_port}"
        omni_wireguard_advertised_endpoint: "${omni_effective.wireguard_advertised_endpoint}"
        # The chart fetches this itself, server-side, so the internal (backchannel)
        # descriptor URL avoids depending on the gateway route being reachable.
        keycloak_saml_url: "${identity_effective.backchannel_issuer}/protocol/saml/descriptor"
        keycloak_realm: "${identity_effective.realm}"
        keycloak_admin_secret: "${(identity_effective.admin_password ?? '') != '' ? 'keycloak-bootstrap-admin' : 'keycloak-initial-admin'}"
        # crewjam/saml (Omni's SAML library) has no configured EntityID, so it
        # falls back to its own metadata URL as the issuer — not the bare root
        # URL — per samlsp.DefaultServiceProvider (samlsp/new.go): metadataURL :=
        # opts.URL.ResolveReference(&url.URL{Path: "saml/metadata"}).
        omni_saml_entity_id: "https://${omni_effective.hostname}${omni_effective.external_port_suffix}/saml/metadata"
        omni_saml_acs_url: "https://${omni_effective.hostname}${omni_effective.external_port_suffix}/saml/acs"
      timeout: 10m
      interval: 5m
    resources:
      - dependsOn:
          - gateway-resources
        components:
          - omni/gateway
          # A dedicated Gateway sharing the shared one's external IP (Cilium's
          # lbipam.cilium.io/sharing-key), not a listener added to the shared Gateway
          # itself — that would need two Kustomizations both applying the same
          # object under Flux's one global field-manager identity. envoy driver
          # keeps the dedicated NodePort/LoadBalancer Service (omni/nodeport) for
          # now; see docs/adr/0005.
          - "${gateway.driver == 'cilium' && lb_effective.mode != 'nodeport' ? 'omni/gateway/wireguard' : ''}"
        substitutions:
          external_domain: "${omni_effective.domain}"
          loadbalancer_start_ip: "${network.loadbalancer_ips.start}"
          omni_wireguard_node_port: "${omni_effective.wireguard_node_port}"
        timeout: 10m
        interval: 5m

  # Contributes into config-observability.yaml's manager-observability Kustomization
  # rather than owning its own — see that facet's comment for why (name collision
  # risk with Core's own observability/telemetry). Neither needs omni/exporter: both
  # work from Omni's native metrics alone, which telemetry.metrics.enabled already
  # scrapes.
  - name: manager-observability
    when: (telemetry.metrics.enabled ?? false) == true
    resources:
      - components:
          - prometheus/alerts/omni
          - grafana/dashboards/omni
        timeout: 5m
        interval: 5m
