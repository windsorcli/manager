kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: provisioning
  description: Downstream cluster provisioning — self-hosted Talos image factory and Sidero Omni

# image_factory and omni toggle independently under provisioning (a single cluster can
# want air-gapped, version-pinned Talos assets without fleet-wide provisioning), so this
# is the coarse OR-gate; every terraform/config/flux entry below carries its own precise
# when: for which of the two it belongs to. Same shape as Core's telemetry facet, whose
# top-level when: is metrics.enabled || logs.enabled with per-component ternaries beneath.
when: provisioning.enabled == true || provisioning.image_factory.enabled == true

requires:
  # Omni only — image_factory has no requirements of its own beyond
  # config-object-store.yaml's shared object_store checks.
  - when: provisioning.enabled == true && identity.enabled != false
    paths:
      - gateway.enabled
    message: Omni's UI/API, Kubernetes proxy, and SideroLink machine API are reached over HTTPS through the cluster gateway — enable the gateway.
  - when: provisioning.enabled == true && identity.enabled != false && dev != true
    paths:
      - provisioning.omni.etcd_encryption_key
    message: Omni needs a GPG-armored private key to decrypt its etcd master key. Generate one with `(export GNUPGHOME=$(mktemp -d); gpg --batch --passphrase '' --quick-gen-key x; gpg -a --export-secret-key > omni.asc; rm -rf $GNUPGHOME)` and set provisioning.omni.etcd_encryption_key via a secret() reference.
  - when: provisioning.enabled == true && identity.enabled != false && (omni_effective.wireguard_advertised_endpoint ?? '') == ''
    paths:
      - provisioning.omni.wireguard.advertised_endpoint
    message: SideroLink's gateway LoadBalancer IP isn't known ahead of a cloud-managed LB controller provisioning it (aws, hetzner, azure). Apply once, then set provisioning.omni.wireguard.advertised_endpoint to <load-balancer-ip>:30180 and apply again.
  - when: provisioning.enabled == true && identity.enabled != false && dev != true
    paths:
      - provisioning.omni.initial_admins
    message: Omni requires at least one bootstrap admin email in config.auth.initialUsers before it will start. Set provisioning.omni.initial_admins to a list of operator emails — real access should route through Keycloak SAML group membership once it's set up.

# =============================================================================
# Terraform — cache signing key (image factory), account ID (omni), object-store
# buckets (image factory's registry, on hetzner/aws)
# =============================================================================
# The signing key and account ID are generated once and held in state, applied only
# when the operator supplies no value of their own. Bucket provisioning only runs
# where the platform's own object storage backs the registry.
terraform:

  - name: image-factory-signing-key
    path: keys/signing
    when: provisioning.image_factory.enabled == true && (provisioning.image_factory.cache_signing_key ?? '') == ''

  - name: omni-account
    path: ids/omni-account
    when: provisioning.enabled == true && identity.enabled != false && (provisioning.omni.account_id ?? '') == ''

  - name: image-factory-object-store
    path: object-store/hetzner
    when: object_store.driver == 'hetzner' && provisioning.image_factory.enabled == true
    inputs:
      access_key: ${hetzner.object_storage.access_key ?? env("HETZNER_S3_ACCESS_KEY")}
      secret_key: ${hetzner.object_storage.secret_key ?? env("HETZNER_S3_SECRET_KEY")}
      location: "${hetzner.object_storage.location ?? 'fsn1'}"
      # Rebuildable cache — force_destroy stays on. Harbor's own bucket
      # (addon-registry.yaml) is a separate stack invocation with its own setting,
      # not shared with this one.
      buckets:
        - "${object_store.prefix}-image-factory"

  - name: image-factory-object-store
    path: object-store/aws
    when: object_store.driver == 'aws' && provisioning.image_factory.enabled == true
    inputs:
      region: ${aws.region}
      buckets:
        - "${object_store.prefix}-image-factory"

config:
  # provisioning.enabled == true fans on the capabilities Omni depends on: Core's
  # identity (Keycloak, and through it the database the server needs) and the image
  # factory Omni provisions Talos machines from. Both schema-default to enabled: false,
  # so a guard here would always read that default back as false — set true
  # unconditionally instead; an operator's own explicit false in values.yaml still wins,
  # since the composer merges raw operator values over facet-computed config last each
  # round.
  - name: identity
    when: provisioning.enabled == true
    value:
      enabled: true

  - name: provisioning
    when: provisioning.enabled == true
    value:
      image_factory:
        enabled: true

  # Bare hostnames (no port) for gateway HTTPRoute matching — sibling single-level
  # subdomains so they fit the gateway's own wildcard certificate SAN (*.<domain>),
  # the same constraint image-factory's own factory.<domain> route works within.
  - name: omni_effective
    value:
      domain: >-
        ${(dns.public_domain ?? '') == ''
          ? (dns.private_domain ?? dns.domain ?? '')
          : dns.public_domain}
      hostname: >-
        ${provisioning.omni.hostname
          ?? ('omni.' + ((dns.public_domain ?? '') == ''
                ? (dns.private_domain ?? dns.domain ?? '')
                : dns.public_domain))}
      kube_proxy_hostname: >-
        ${'omni-kube.' + ((dns.public_domain ?? '') == ''
              ? (dns.private_domain ?? dns.domain ?? '')
              : dns.public_domain)}
      machine_api_hostname: >-
        ${'omni-siderolink.' + ((dns.public_domain ?? '') == ''
              ? (dns.private_domain ?? dns.domain ?? '')
              : dns.public_domain)}
      # docker-desktop reaches the gateway on 8443 rather than 443 — same port
      # image-factory's own external URL derivation appends.
      external_port_suffix: "${workstation.runtime == 'docker-desktop' ? ':8443' : ''}"
      # NodePort environments (docker-desktop by default) and envoy driver keep the
      # chart's own dedicated Service (omni/nodeport, omni/loadbalancer). cilium
      # driver routes through a dedicated Gateway sharing the shared gateway's IP
      # instead (omni/gateway/wireguard) — see docs/adr/0005 for why not envoy too.
      wireguard_node_port: "${provisioning.omni.wireguard.node_port ?? 30180}"
      # NodePort: derive from the control-plane node's own address (not 127.0.0.1 —
      # a remote device dials this, docker-desktop's loopback trick doesn't apply).
      # cilium: the shared gateway's IP is pinned (lbipam.cilium.io/ips), known
      # without an apply. Everything else (envoy's own dedicated Service, cloud LB
      # controllers) has no derivable default — dev mode gets a placeholder, others
      # hit the requires: check below.
      wireguard_advertised_endpoint: >-
        ${provisioning.omni.wireguard.advertised_endpoint
          ?? (lb_effective.mode == 'nodeport'
              ? (len(terraform_output('compute', 'controlplanes') ?? []) > 0
                  ? (split(terraform_output('compute', 'controlplanes')[0].endpoint, ':')[0] + ':' + string(provisioning.omni.wireguard.node_port ?? 30180))
                  : (len(values(cluster.controlplanes.nodes ?? {})) > 0
                      ? (split(values(cluster.controlplanes.nodes)[0].endpoint, ':')[0] + ':' + string(provisioning.omni.wireguard.node_port ?? 30180))
                      : (dev == true ? '0.0.0.0:' + string(provisioning.omni.wireguard.node_port ?? 30180) : '')))
              : (gateway.driver == 'cilium' && lb_effective.controller_required != true
                  ? network.loadbalancer_ips.start + ':' + string(provisioning.omni.wireguard.node_port ?? 30180)
                  : (dev == true ? '0.0.0.0:' + string(provisioning.omni.wireguard.node_port ?? 30180) : '')))}

  # docker-desktop only forwards explicitly published container ports, so the
  # NodePort needs a matching hostport (same-port passthrough). An operator's own
  # hostports list still wins (raw values merge over facet-computed config last).
  - name: cluster
    when: provisioning.enabled == true && identity.enabled != false && workstation.runtime == 'docker-desktop'
    value:
      controlplanes:
        hostports: >-
          ${["8080:30080/tcp", "8443:30443/tcp",
             string(provisioning.omni.wireguard.node_port ?? 30180) + ":" + string(provisioning.omni.wireguard.node_port ?? 30180) + "/udp"]}
      workers:
        hostports: >-
          ${["8080:30080/tcp", "8443:30443/tcp",
             string(provisioning.omni.wireguard.node_port ?? 30180) + ":" + string(provisioning.omni.wireguard.node_port ?? 30180) + "/udp"]}

  # Split from the block above so the dev-only key can be a plain literal rather
  # than an expression string (the expression grammar has no escape for embedded
  # newlines). Same shape as Core's dev-vs-supplied admin secret: an operator's own
  # key always wins; the fixed key below only fills in under dev == true.
  - name: omni_effective
    when: (provisioning.omni.etcd_encryption_key ?? '') != ''
    value:
      etcd_encryption_key: ${provisioning.omni.etcd_encryption_key}

  - name: omni_effective
    when: (provisioning.omni.etcd_encryption_key ?? '') == '' && dev == true
    value:
      etcd_encryption_key: |
        -----BEGIN PGP PRIVATE KEY BLOCK-----

        lFgEam/o7RYJKwYBBAHaRw8BAQdAvJ9sgNU/mNzzUURBYW6rkxtT4CG3gBGpE+eE
        Zb2p0doAAQC6a3yRWocfjRbzoj0kbi1Kaf6J2RVYSJIeXIibogXNfw5RtBZvbW5p
        LWRldkB3aW5kc29yLmxvY2FsiJkEExYKAEEWIQQCFqLg03r7RzBHWbarvUkg+WLH
        RAUCam/o7QIbAwUJBaOagAULCQgHAgIiAgYVCgkICwIEFgIDAQIeBwIXgAAKCRCr
        vUkg+WLHRNj1AP9fTur/3Cq1p201dcKiEKTK11f3f94RsM7OL/H5dqS+hAD/Wq85
        8HRIUTCBxYuHUN/avZsqNrgKJp+kQ3Jn7zsacwCcXQRqb+jtEgorBgEEAZdVAQUB
        AQdABe+v5DT6Lecck95BrSJPhgjTkvm+cusXbfcF5Sj4pzkDAQgHAAD/aD9EB6jX
