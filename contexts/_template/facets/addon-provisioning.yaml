# =============================================================================
# Flux systems — image factory, omni
# =============================================================================
# Both kustomizations point at kustomize/provisioning (path: below): pki-install issues
# the TLS certificate and gateway-install supplies the route CRDs for image-factory;
# identity-resources gives omni its SAML realm to register against. Every namespace,
# HelmRelease, and conditional add-on lives under kustomize/provisioning — see its
# README for the full component/dependency tables.
#
flux:

  - name: image-factory
    when: provisioning.image_factory.enabled == true
    path: provisioning
    dependsOn:
      - pki-install
      - "${gateway.enabled == true ? 'gateway-install' : ''}"
    # The chart reads the key from the data key `cache-signing.key`.
    secrets:
      registry-s3:
        data:
          access_key: ${hetzner.object_storage.access_key ?? env("HETZNER_S3_ACCESS_KEY") ?? ''}
          secret_key: ${hetzner.object_storage.secret_key ?? env("HETZNER_S3_SECRET_KEY") ?? ''}
      image-factory-cache-signing-key:
        data:
          cache-signing.key: ${provisioning.image_factory.cache_signing_key ?? terraform_output("image-factory-signing-key", "private_key_pem")}
    install:
      components:
        - image-factory
        - "${(provisioning.image_factory.registry.schematic.registry ?? '') == '' ? 'registry' : ''}"
        - "${(provisioning.image_factory.registry.schematic.registry ?? '') == '' && (object_store.driver == 'hetzner' || object_store.driver == 'aws') ? 'registry/s3' : ''}"
        - "${(provisioning.image_factory.registry.schematic.registry ?? '') == '' && object_store.driver != 'hetzner' && object_store.driver != 'aws' ? 'registry/pvc' : ''}"
        - "${topology == 'ha' ? 'image-factory/ha' : ''}"
        - "${(telemetry.metrics.enabled ?? false) == true ? 'image-factory/prometheus' : ''}"
      substitutions:
        # The same expression the terraform block above hands the bucket module, so
        # the registry and the bucket that gets provisioned cannot drift apart.
        registry_bucket: "${object_store.prefix}-image-factory"
        registry_region: "${object_store.region ?? ''}"
        registry_endpoint: "${object_store.endpoint ?? ''}"
        registry_storage_class: "${cluster.storage.class ?? 'single'}"
        registry_storage_size: "${provisioning.image_factory.registry_size ?? '10Gi'}"
        registry_replicas: "${topology == 'ha' && (object_store.driver == 'hetzner' || object_store.driver == 'aws') ? 2 : 1}"
        external_domain: "${(dns.public_domain ?? '') == '' ? (dns.private_domain ?? dns.domain ?? '') : dns.public_domain}"
        # Explicit override wins; else derive from the domain the route publishes on.
        # docker-desktop reaches the gateway on 8443 rather than 443.
        factory_external_url: >-
          ${provisioning.image_factory.external_url
            ?? ('https://factory.' + ((dns.public_domain ?? '') == ''
                  ? (dns.private_domain ?? dns.domain ?? '')
                  : dns.public_domain)
                + (workstation.runtime == 'docker-desktop' ? ':8443' : ''))}
        factory_schematic_registry: "${provisioning.image_factory.registry.schematic.registry ?? 'registry.provisioning.svc.cluster.local:5000'}"
        factory_schematic_namespace: "${provisioning.image_factory.registry.schematic.namespace ?? 'siderolabs/image-factory'}"
        factory_schematic_repository: "${provisioning.image_factory.registry.schematic.repository ?? 'schematics'}"
        factory_schematic_insecure: "${(provisioning.image_factory.registry.schematic.registry ?? '') == '' ? true : (provisioning.image_factory.registry.schematic.insecure ?? false)}"
        factory_max_concurrency: "${provisioning.image_factory.max_concurrency ?? 6}"
        factory_min_talos_version: "${provisioning.image_factory.min_talos_version ?? '1.2.0'}"
        factory_cache_registry: "${provisioning.image_factory.registry.schematic.registry ?? 'registry.provisioning.svc.cluster.local:5000'}"
        factory_cache_insecure: "${(provisioning.image_factory.registry.schematic.registry ?? '') == '' ? true : (provisioning.image_factory.registry.schematic.insecure ?? false)}"
        # Same registry as schematic/cache above — the chart's own default
        # (ghcr.io/siderolabs) is the upstream project's namespace, which a
        # self-hosted factory has no push credentials for.
        factory_installer_registry: "${provisioning.image_factory.registry.schematic.registry ?? 'registry.provisioning.svc.cluster.local:5000'}"
        factory_installer_repository: "${provisioning.image_factory.registry.installer.repository ?? 'installer'}"
        factory_installer_insecure: "${(provisioning.image_factory.registry.schematic.registry ?? '') == '' ? true : (provisioning.image_factory.registry.schematic.insecure ?? false)}"
      timeout: 10m
      interval: 5m
    resources:
      - when: (gateway.enabled ?? ingress.enabled ?? true) == true
        dependsOn:
          - gateway-resources
        components:
          - image-factory/gateway
        substitutions:
          external_domain: "${(dns.public_domain ?? '') == '' ? (dns.private_domain ?? dns.domain ?? '') : dns.public_domain}"
        timeout: 10m
        interval: 5m

  # identity-resources because Omni's SAML config points at the platform realm's
  # descriptor at startup, and the omni/saml-client Job registers Omni as a client of
  # that same realm over the admin REST API.
  #
  # Conditional components:
  #   - omni/prometheus: metrics Service and ServiceMonitor.
  #   - omni/exporter: omni_exporter Deployment (siderolabs/omni_exporter), off until
  #     provisioning.omni.service_account_key is set — nothing here can create that
  #     key. It's a Reader-role service account, an admin creates by hand after first
  #     login (`omnictl serviceaccount create --use-user-role=false --role=Reader
  #     omni-exporter`) and hands to Windsor via a secret() reference. Everything past
  #     that point — the Deployment, the Secret, the ServiceMonitor — is ordinary Manager
  #     automation; only the key itself is unautomatable.
  #
  # Omni's own install has no identity-resources dependency: keycloak_saml_url is a
  # plain computed string (identity_effective.backchannel_issuer), not a live call, so
  # the chart boots fine before the realm exists — SAML login just isn't functional
  # yet. Only the saml-client Job actually calls the realm's admin API, so only its
  # own resources variant below waits on identity-resources.
  - name: omni
    when: provisioning.enabled == true && identity.enabled != false
    path: provisioning
    secrets:
      omni-etcd-encryption-key:
        data:
          omni.asc: ${omni_effective.etcd_encryption_key}
      # Empty unless provisioning.omni.service_account_key is set — harmless either
      # way, since omni/exporter (the only consumer) is excluded from components in
      # that case too.
      omni-service-account-key:
        data:
          key: ${provisioning.omni.service_account_key ?? ''}
    install:
      components:
        - omni
        - "${(telemetry.metrics.enabled ?? false) == true ? 'omni/prometheus' : ''}"
        - "${lb_effective.mode == 'nodeport' ? 'omni/nodeport' : ''}"
        - "${lb_effective.mode != 'nodeport' && gateway.driver != 'cilium' ? 'omni/loadbalancer' : ''}"
        - "${(telemetry.metrics.enabled ?? false) == true && (provisioning.omni.service_account_key ?? '') != '' ? 'omni/exporter' : ''}"
      substitutions:
        omni_account_id: "${provisioning.omni.account_id ?? terraform_output('omni-account', 'id')}"
        omni_hostname: "${omni_effective.hostname}${omni_effective.external_port_suffix}"
        omni_kube_proxy_hostname: "${omni_effective.kube_proxy_hostname}${omni_effective.external_port_suffix}"
        omni_machine_api_hostname: "${omni_effective.machine_api_hostname}${omni_effective.external_port_suffix}"
        omni_persistence_size: "${provisioning.omni.persistence_size ?? '16Gi'}"
        omni_persistence_storage_class: "${cluster.storage.class ?? 'single'}"
        # config.registries.imageFactoryBaseURL. This one value serves two
        # purposes in Omni's own client (client/pkg/imagefactory/client.go): its
        # own reconciliation calls, and the download links it hands back to an
        # operator's browser — so it has to be the external, browser-reachable
        # URL, not the in-cluster Service. Falls back to Manager's own image
        # factory when it's enabled, else the chart's public default.
        omni_image_factory_url: "${provisioning.image_factory.external_url ?? (provisioning.image_factory.enabled == true ? ('https://factory.' + omni_effective.domain + omni_effective.external_port_suffix) : 'https://factory.talos.dev')}"
        # The chart refuses to start with zero initial users. dev mode seeds
        # Core's own dev admin (keycloak/realm/dev-user), so a SAML login with
        # that same identity is recognized immediately — not a separate,
        # unrelated placeholder identity.
        omni_initial_admins: "${provisioning.omni.initial_admins ?? (dev == true ? ['admin@local.test'] : [])}"
        omni_wireguard_node_port: "${omni_effective.wireguard_node_port}"
        omni_wireguard_advertised_endpoint: "${omni_effective.wireguard_advertised_endpoint}"
        # The chart fetches this itself, server-side, so the internal (backchannel)
        # descriptor URL avoids depending on the gateway route being reachable.
        keycloak_saml_url: "${identity_effective.backchannel_issuer}/protocol/saml/descriptor"
      timeout: 10m
      interval: 5m
    resources:
      - dependsOn:
          - gateway-resources
        components:
          - omni/gateway
          # A dedicated Gateway sharing the shared one's external IP (Cilium's
          # lbipam.cilium.io/sharing-key), not a listener added to the shared Gateway
          # itself — that would need two Kustomizations both applying the same
          # object under Flux's one global field-manager identity. envoy driver
          # keeps the dedicated NodePort/LoadBalancer Service (omni/nodeport) for
          # now; see docs/adr/0005.
          - "${gateway.driver == 'cilium' && lb_effective.mode != 'nodeport' ? 'omni/gateway/wireguard' : ''}"
        substitutions:
          external_domain: "${omni_effective.domain}"
          loadbalancer_start_ip: "${network.loadbalancer_ips.start}"
          omni_wireguard_node_port: "${omni_effective.wireguard_node_port}"
        timeout: 10m
        interval: 5m

      # SAML client registration. A named resources variant, not a component of the
      # install tier above, so it depends on identity without gating Omni's own
      # install — the same shape addon-registry.yaml uses for Harbor's own OIDC.
      - name: saml-client
        dependsOn:
          - omni-install
          - identity-resources
        components:
          - omni/saml-client
        substitutions:
          keycloak_realm: "${identity_effective.realm}"
          keycloak_admin_secret: "${(identity_effective.admin_password ?? '') != '' ? 'keycloak-bootstrap-admin' : 'keycloak-initial-admin'}"
          # crewjam/saml (Omni's SAML library) has no configured EntityID, so it
          # falls back to its own metadata URL as the issuer — not the bare root
          # URL — per samlsp.DefaultServiceProvider (samlsp/new.go): metadataURL :=
          # opts.URL.ResolveReference(&url.URL{Path: "saml/metadata"}).
          omni_saml_entity_id: "https://${omni_effective.hostname}${omni_effective.external_port_suffix}/saml/metadata"
          omni_saml_acs_url: "https://${omni_effective.hostname}${omni_effective.external_port_suffix}/saml/acs"
        # Keycloak's cold-start-to-Ready can run to ~20m under load; this Job alone
        # absorbs that now, not Omni's own install.
        timeout: 25m
        interval: 5m

  # Both contribute into config-observability.yaml's manager-observability
  # Kustomization rather than owning their own — see that facet's comment for why
  # (name collision risk with Core's own observability/telemetry).
  - name: manager-observability
    when: provisioning.image_factory.enabled == true && (telemetry.metrics.enabled ?? false) == true
    resources:
      - components:
          - prometheus/alerts/image-factory
          - grafana/dashboards/image-factory
        timeout: 5m
        interval: 5m

  # Neither needs omni/exporter: both work from Omni's native metrics alone, which
  # telemetry.metrics.enabled already scrapes.
  - name: manager-observability
    when: provisioning.enabled == true && identity.enabled != false && (telemetry.metrics.enabled ?? false) == true
    resources:
      - components:
          - prometheus/alerts/omni
          - grafana/dashboards/omni
        timeout: 5m
        interval: 5m
