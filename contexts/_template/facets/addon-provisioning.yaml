kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: provisioning
  description: Downstream cluster provisioning — self-hosted Talos image factory and Sidero Omni

# image_factory and omni toggle independently under provisioning (a single cluster can
# want air-gapped, version-pinned Talos assets without fleet-wide provisioning), so this
# is the coarse OR-gate; every terraform/config/flux entry below carries its own precise
# when: for which of the two it belongs to. Same shape as Core's telemetry facet, whose
# top-level when: is metrics.enabled || logs.enabled with per-component ternaries beneath.
when: >-
  provisioning.enabled == true || provisioning.image_factory.enabled == true ||
  provisioning.omni.enabled == true

requires:
  # Omni only — image_factory has no requirements of its own beyond
  # config-object-store.yaml's shared object_store checks.
  - when: provisioning_effective.omni == true
    paths:
      - gateway.enabled
    message: Omni's UI/API, Kubernetes proxy, and SideroLink machine API are reached over HTTPS through the cluster gateway — enable the gateway.
  - when: >-
      provisioning_effective.omni == true && dev != true &&
      omni_wireguard.gateway_routed == true && omni_wireguard.gateway_ip == '' &&
      (provisioning.omni.wireguard.advertised_endpoint ?? '') == '' &&
      provisioning_gateway.name == 'external'
    message: >-
      On the cilium gateway driver, SideroLink shares the external gateway's address.
      Set gateway.external.ip, or set provisioning.omni.wireguard.advertised_endpoint.
  - when: >-
      provisioning_effective.omni == true && dev != true &&
      omni_wireguard.gateway_routed == true && omni_wireguard.gateway_ip == '' &&
      (provisioning.omni.wireguard.advertised_endpoint ?? '') == '' &&
      provisioning_gateway.name == 'internal'
    message: >-
      On the cilium gateway driver without an external gateway, SideroLink shares the
      internal gateway's address. Set gateway.internal.ip, or set
      provisioning.omni.wireguard.advertised_endpoint.
  - when: >-
      provisioning_effective.omni == true && omni_wireguard.gateway_routed != true &&
      (omni_effective.wireguard_advertised_endpoint ?? '') == ''
    paths:
      - provisioning.omni.wireguard.advertised_endpoint
    message: SideroLink's gateway LoadBalancer IP isn't known ahead of a cloud-managed LB controller provisioning it (aws, hetzner, azure). Apply once, then set provisioning.omni.wireguard.advertised_endpoint to <load-balancer-ip>:30180 and apply again.
  - when: provisioning_effective.omni == true && dev != true
    paths:
      - provisioning.omni.initial_admins
    message: Omni requires at least one bootstrap admin email in config.auth.initialUsers before it will start. Set provisioning.omni.initial_admins to a list of operator emails — real access should route through Keycloak SAML group membership once it's set up.

# =============================================================================
# Terraform — cache signing key (image factory), account ID (omni), omni's backup
# bucket. The registry's own bucket lives in addon-registry.yaml now.
# =============================================================================
# Generated once and held in state; applied only when the operator supplies no
# value of their own. provisioning/omni also holds Omni's etcd backup S3 config,
# commented out for now — see that module's README.
terraform:

  - name: image-factory-signing-key
    path: keys/signing
    when: >-
      provisioning.image_factory.enabled == true &&
      (provisioning.image_factory.cache_signing_key ?? '') == ''

  - name: omni-account
    path: provisioning/omni
    when: >-
      (provisioning.enabled == true || provisioning.omni.enabled == true) && identity.enabled != false &&
      (provisioning.omni.account_id ?? '') == ''

  - name: omni-backup-object-store
    path: object-store/hetzner
    when: object_store.driver == 'hetzner' && provisioning.omni.backup.enabled == true
    inputs:
      access_key: ${hetzner.object_storage.access_key ?? env("HETZNER_S3_ACCESS_KEY")}
      secret_key: ${hetzner.object_storage.secret_key ?? env("HETZNER_S3_SECRET_KEY")}
      location: "${hetzner.object_storage.location ?? 'fsn1'}"
      # Backups, not a rebuildable cache — keeps version history.
      force_destroy: "${provisioning.omni.backup.force_destroy ?? false}"
      versioning: true
      buckets:
        - "${object_store.prefix}-omni-backup"

  - name: omni-backup-object-store
    path: object-store/aws
    when: object_store.driver == 'aws' && provisioning.omni.backup.enabled == true
    inputs:
      region: ${aws.region}
      force_destroy: "${provisioning.omni.backup.force_destroy ?? false}"
      versioning: true
      buckets:
        - "${object_store.prefix}-omni-backup"

config:
  # provisioning.enabled turns on identity and the image factory too.
  # provisioning.omni.enabled turns on just identity and Omni.
  # All three default to false. A guard here would read that default back as false, so
  # this sets true unconditionally instead. An operator's explicit false still wins:
  # raw operator values merge over facet-computed config last.
  - name: identity
    when: provisioning.enabled == true || provisioning.omni.enabled == true
    value:
      enabled: true

  - name: provisioning
    when: provisioning.enabled == true
    value:
      image_factory:
        enabled: true
      omni:
        enabled: true

  # The factory needs a registry to push to. Turn one on, unless the operator
  # already named an external registry this repo doesn't manage.
  - name: registry
    when: >-
      provisioning.image_factory.enabled == true &&
      (provisioning.image_factory.registry.schematic.registry ?? '') == ''
    value:
      enabled: true

  # Predicates and image factory settings shared by the entries below.
  - name: provisioning_effective
    value:
      # Omni runs under provisioning.enabled or provisioning.omni.enabled, unless
      # identity is explicitly off.
      omni: >-
        ${(provisioning.enabled == true || provisioning.omni.enabled == true) &&
        identity.enabled != false}
      # No operator key: the omni/etcd-key Job generates one in-cluster.
      omni_generated_key: >-
        ${(provisioning.enabled == true || provisioning.omni.enabled == true) &&
        identity.enabled != false && (provisioning.omni.etcd_encryption_key ?? '') == ''}
      metrics: "${(telemetry.metrics.enabled ?? false) == true}"
      harbor: "${(registry_effective.driver ?? '') == 'harbor'}"
      # An explicit schematic registry wins; else the registry capability's own.
      factory_registry: >-
        ${provisioning.image_factory.registry.schematic.registry ?? registry_effective.hostname}
      factory_registry_insecure: >-
        ${(provisioning.image_factory.registry.schematic.registry ?? '') == ''
          ? registry_effective.insecure
          : (provisioning.image_factory.registry.schematic.insecure ?? false)}
      # Explicit override wins; else the factory's own route. docker-desktop reaches
      # the gateway on 8443 rather than 443.
      factory_url: >-
        ${provisioning.image_factory.external_url
          ?? ('https://factory.' + omni_effective.domain + omni_effective.external_port_suffix)}

  # The core Gateway the routes attach to: internal when core builds no external one.
  - name: provisioning_gateway
    value:
      name: "${(gateway_effective.external_enabled ?? true) == true ? 'external' : 'internal'}"

  # SideroLink WireGuard exposure. On the cilium driver outside NodePort mode, the
  # omni-wireguard Gateway takes the address and LB-IPAM sharing-key of the Gateway
  # the routes use, so both answer on one IP. Without gateway.external.ip, the
  # external gateway sits at the first network.loadbalancer_ips address.
  - name: omni_wireguard
    value:
      port: "${provisioning.omni.wireguard.node_port ?? 30180}"
      gateway_routed: >-
        ${lb_effective.mode != 'nodeport' && gateway.driver == 'cilium' &&
        lb_effective.controller_required != true}
      gateway_ip: >-
        ${provisioning_gateway.name == 'external'
          ? (gateway.external.ip ?? network.loadbalancer_ips.start ?? '')
          : (gateway.internal.ip ?? '')}
      # First control-plane address. A remote device dials it, so 127.0.0.1 won't do.
      node_ip: >-
        ${len(terraform_output('compute', 'controlplanes') ?? []) > 0
          ? split(terraform_output('compute', 'controlplanes')[0].endpoint, ':')[0]
          : (len(values(cluster.controlplanes.nodes ?? {})) > 0
              ? split(values(cluster.controlplanes.nodes)[0].endpoint, ':')[0]
              : '')}

  # Bare hostnames (no port) for gateway HTTPRoute matching — sibling single-level
  # subdomains so they fit the gateway's own wildcard certificate SAN (*.<domain>),
  # the same constraint image-factory's own factory.<domain> route works within.
  - name: omni_effective
    value:
      domain: >-
        ${(dns.public_domain ?? '') == ''
          ? (dns.private_domain ?? dns.domain ?? '')
          : dns.public_domain}
      hostname: >-
        ${provisioning.omni.hostname
          ?? ('omni.' + ((dns.public_domain ?? '') == ''
                ? (dns.private_domain ?? dns.domain ?? '')
                : dns.public_domain))}
      kube_proxy_hostname: >-
        ${'omni-kube.' + ((dns.public_domain ?? '') == ''
              ? (dns.private_domain ?? dns.domain ?? '')
              : dns.public_domain)}
      machine_api_hostname: >-
        ${'omni-siderolink.' + ((dns.public_domain ?? '') == ''
              ? (dns.private_domain ?? dns.domain ?? '')
              : dns.public_domain)}
      # docker-desktop reaches the gateway on 8443 rather than 443 — same port
      # image-factory's own external URL derivation appends.
      external_port_suffix: "${workstation.runtime == 'docker-desktop' ? ':8443' : ''}"
      # NodePort mode and the envoy driver keep the chart's own Service
      # (omni/nodeport, omni/loadbalancer); docs/adr/0005 explains why.
      wireguard_node_port: "${omni_wireguard.port}"
      # NodePort mode advertises the control-plane address and cilium the gateway
      # address, both known before an apply. envoy's Service and cloud LB controllers
      # assign an address only at apply time: dev mode gets a placeholder, and other
      # contexts hit the requires: check above.
      wireguard_advertised_endpoint: >-
        ${provisioning.omni.wireguard.advertised_endpoint ?? (
          let host = lb_effective.mode == 'nodeport' ? omni_wireguard.node_ip
            : (omni_wireguard.gateway_routed == true ? omni_wireguard.gateway_ip : '');
          host != '' ? host + ':' + string(omni_wireguard.port)
            : (dev == true ? '0.0.0.0:' + string(omni_wireguard.port) : ''))}

  # docker-desktop only forwards explicitly published container ports, so the
  # NodePort needs a matching hostport (same-port passthrough). An operator's own
  # hostports list still wins (raw values merge over facet-computed config last).
  - name: cluster
    when: >-
      (provisioning.enabled == true || provisioning.omni.enabled == true) && identity.enabled != false &&
      workstation.runtime == 'docker-desktop'
    value:
      controlplanes:
        hostports: >-
          ${let port = string(provisioning.omni.wireguard.node_port ?? 30180);
          ["8080:30080/tcp", "8443:30443/tcp", port + ":" + port + "/udp"]}
      workers:
        hostports: >-
          ${let port = string(provisioning.omni.wireguard.node_port ?? 30180);
          ["8080:30080/tcp", "8443:30443/tcp", port + ":" + port + "/udp"]}

# =============================================================================
# Flux systems — image factory, omni
# =============================================================================
# All three point at kustomize/provisioning; see its README for the full component/dependency tables.
#
flux:

  # Owns the shared Namespace/HelmRepository; image-factory-install and omni-install depend on it.
  - name: provisioning-base
    when: provisioning.image_factory.enabled == true || provisioning_effective.omni == true
    path: provisioning
    install:
      components:
        - namespace
      timeout: 5m
      interval: 5m

  - name: image-factory
    when: provisioning.image_factory.enabled == true
    path: provisioning
    dependsOn:
      - provisioning-base-install
      - pki-install
      - "${gateway.enabled == true ? 'gateway-install' : ''}"
    # The chart reads the key from the data key `cache-signing.key`.
    secrets:
      image-factory-cache-signing-key:
        data:
          cache-signing.key: >-
            ${provisioning.image_factory.cache_signing_key
              ?? terraform_output("image-factory-signing-key", "private_key_pem")}
    install:
      components:
        - image-factory
        - "${topology == 'ha' ? 'image-factory/ha' : ''}"
        - "${provisioning_effective.metrics == true ? 'image-factory/prometheus' : ''}"
        - "${provisioning_effective.harbor == true ? 'image-factory/harbor-auth' : ''}"
      substitutions:
        external_domain: "${omni_effective.domain}"
        factory_external_url: "${provisioning_effective.factory_url}"
        # An explicit override wins; else read the registry capability's own config.
        # Harbor requires a project (a namespace with at least one path segment); the
        # distribution driver has no such constraint, so only harbor gets a default here.
        factory_schematic_registry: "${provisioning_effective.factory_registry}"
        factory_schematic_namespace: >-
          ${provisioning.image_factory.registry.schematic.namespace
            ?? (provisioning_effective.harbor == true ? 'image-factory' : 'siderolabs/image-factory')}
        factory_schematic_repository: "${provisioning.image_factory.registry.schematic.repository ?? 'schematics'}"
        factory_schematic_insecure: "${provisioning_effective.factory_registry_insecure}"
        factory_max_concurrency: "${provisioning.image_factory.max_concurrency ?? 6}"
        factory_min_talos_version: "${provisioning.image_factory.min_talos_version ?? '1.2.0'}"
        factory_cache_registry: "${provisioning_effective.factory_registry}"
        factory_cache_insecure: "${provisioning_effective.factory_registry_insecure}"
        # Same registry as schematic/cache above — the chart's own default
        # (ghcr.io/siderolabs) is the upstream project's namespace, which a
        # self-hosted factory has no push credentials for.
        factory_installer_registry: "${provisioning_effective.factory_registry}"
        factory_installer_namespace: >-
          ${provisioning.image_factory.registry.installer.namespace
            ?? (provisioning_effective.harbor == true ? 'image-factory' : '')}
        factory_installer_repository: "${provisioning.image_factory.registry.installer.repository ?? 'installer'}"
        factory_installer_insecure: "${provisioning_effective.factory_registry_insecure}"
      timeout: 10m
      interval: 5m
    resources:
      - when: (gateway.enabled ?? ingress.enabled ?? true) == true
        # gateway-install, not a gateway resources variant: core names each
        # variant after the gateway it builds, and which gateways exist follows
        # the domains. The route attaches once its Gateway is up.
        dependsOn:
          - gateway-install
        components:
          - image-factory/gateway
        substitutions:
          external_domain: "${omni_effective.domain}"
          gateway_name: "${provisioning_gateway.name}"
        timeout: 10m
        interval: 5m

  # identity-resources because Omni's SAML config points at the platform realm's
  # descriptor at startup, and the omni/saml-client Job registers Omni as a client of
  # that same realm over the admin REST API.
  #
  # Conditional components:
  #   - omni/prometheus: metrics Service and ServiceMonitor.
  #   - omni/exporter: omni_exporter Deployment (siderolabs/omni_exporter), off until
  #     provisioning.omni.service_account_key is set — nothing here can create that
  #     key. It's a Reader-role service account, an admin creates by hand after first
  #     login (`omnictl serviceaccount create --use-user-role=false --role=Reader
  #     omni-exporter`) and hands to Windsor via a secret() reference. Everything past
  #     that point — the Deployment, the Secret, the ServiceMonitor — is ordinary Manager
  #     automation; only the key itself is unautomatable.
  #
  # Omni's own install has no identity-resources dependency: keycloak_saml_url is a
  # plain computed string (identity_effective.backchannel_issuer), not a live call, so
  # the chart boots fine before the realm exists — SAML login just isn't functional
  # yet. Only the saml-client Job actually calls the realm's admin API, so only its
  # own resources variant below waits on identity-resources.
  - name: omni
    when: provisioning_effective.omni == true
    path: provisioning
    dependsOn:
      - provisioning-base-install
    secrets:
      # Empty unless provisioning.omni.service_account_key is set — harmless either
      # way, since omni/exporter (the only consumer) is excluded from components in
      # that case too.
      omni-service-account-key:
        data:
          key: ${provisioning.omni.service_account_key ?? ''}
    install:
      components:
        - omni
        - "${provisioning_effective.omni_generated_key == true ? 'omni/etcd-key' : ''}"
        - "${provisioning_effective.metrics == true ? 'omni/prometheus' : ''}"
        - "${lb_effective.mode == 'nodeport' ? 'omni/nodeport' : ''}"
        - "${lb_effective.mode != 'nodeport' && gateway.driver != 'cilium' ? 'omni/loadbalancer' : ''}"
        - >-
          ${provisioning_effective.metrics == true && (provisioning.omni.service_account_key ?? '') != '' ?
          'omni/exporter' : ''}
      substitutions:
        omni_account_id: "${provisioning.omni.account_id ?? terraform_output('omni-account', 'id')}"
        omni_hostname: "${omni_effective.hostname}${omni_effective.external_port_suffix}"
        omni_kube_proxy_hostname: "${omni_effective.kube_proxy_hostname}${omni_effective.external_port_suffix}"
        omni_machine_api_hostname: "${omni_effective.machine_api_hostname}${omni_effective.external_port_suffix}"
        omni_persistence_size: "${provisioning.omni.persistence_size ?? '16Gi'}"
        omni_persistence_storage_class: "${cluster.storage.class ?? 'single'}"
        # config.registries.imageFactoryBaseURL. This one value serves two
        # purposes in Omni's own client (client/pkg/imagefactory/client.go): its
        # own reconciliation calls, and the download links it hands back to an
        # operator's browser — so it has to be the external, browser-reachable
        # URL, not the in-cluster Service. Falls back to Manager's own image
        # factory when it's enabled, else the chart's public default.
        omni_image_factory_url: >-
          ${provisioning.image_factory.enabled == true || (provisioning.image_factory.external_url ?? '') != ''
            ? provisioning_effective.factory_url : 'https://factory.talos.dev'}
        # The chart refuses to start with zero initial users. dev mode seeds
        # Core's own dev admin (keycloak/realm/dev-user), so a SAML login with
        # that same identity is recognized immediately — not a separate,
        # unrelated placeholder identity.
        omni_initial_admins: "${provisioning.omni.initial_admins ?? (dev == true ? ['dev-admin@local.test'] : [])}"
        omni_wireguard_node_port: "${omni_effective.wireguard_node_port}"
        omni_wireguard_advertised_endpoint: "${omni_effective.wireguard_advertised_endpoint}"
        # The chart fetches this itself, server-side, so the internal (backchannel)
        # descriptor URL avoids depending on the gateway route being reachable.
        keycloak_saml_url: "${identity_effective.backchannel_issuer}/protocol/saml/descriptor"
      timeout: 10m
      interval: 5m
    resources:
      # gateway-install, not a gateway resources variant: core names each
      # variant after the gateway it builds, and which gateways exist follows
      # the domains. The routes attach once their Gateway is up.
      - dependsOn:
          - gateway-install
        components:
          - omni/gateway
          # A dedicated Gateway on the routes' Gateway IP (Cilium's
          # lbipam.cilium.io/sharing-key), not a listener added to core's Gateway:
          # two Kustomizations applying one object fight under Flux's single
          # field-manager identity. See docs/adr/0005.
          - "${gateway.driver == 'cilium' && lb_effective.mode != 'nodeport' ? 'omni/gateway/wireguard' : ''}"
        substitutions:
          external_domain: "${omni_effective.domain}"
          gateway_name: "${provisioning_gateway.name}"
          wireguard_gateway_ip: "${omni_wireguard.gateway_ip}"
          omni_wireguard_node_port: "${omni_wireguard.port}"
        timeout: 10m
        interval: 5m

      # SAML client registration. A named resources variant, not a component of the
      # install tier above, so it depends on identity without gating Omni's own
      # install — the same shape addon-registry.yaml uses for Harbor's own OIDC.
      - name: saml-client
        dependsOn:
          - omni-install
          - identity-resources
        components:
          - omni/saml-client
        substitutions:
          keycloak_realm: "${identity_effective.realm}"
          keycloak_admin_secret: >-
            ${(identity_effective.admin_password ?? '') != ''
              ? 'keycloak-bootstrap-admin' : 'keycloak-initial-admin'}
          # crewjam/saml (Omni's SAML library) has no configured EntityID, so it
          # falls back to its own metadata URL as the issuer — not the bare root
          # URL — per samlsp.DefaultServiceProvider (samlsp/new.go): metadataURL :=
          # opts.URL.ResolveReference(&url.URL{Path: "saml/metadata"}).
          omni_saml_entity_id: "https://${omni_effective.hostname}${omni_effective.external_port_suffix}/saml/metadata"
          omni_saml_acs_url: "https://${omni_effective.hostname}${omni_effective.external_port_suffix}/saml/acs"
        # Keycloak's cold-start-to-Ready can run to ~20m under load; this Job alone
        # absorbs that now, not Omni's own install.
        timeout: 25m
        interval: 5m

  # An operator's key. Otherwise the omni/etcd-key Job creates its own Secret, which a
  # secrets: entry here would not own.
  - name: omni
    when: provisioning_effective.omni == true && provisioning_effective.omni_generated_key != true
    secrets:
      omni-etcd-encryption-key:
        data:
          omni.asc: ${provisioning.omni.etcd_encryption_key}

  # Both contribute into config-observability.yaml's manager-observability
  # Kustomization rather than owning their own — see that facet's comment for why
  # (name collision risk with Core's own observability/telemetry).
  - name: manager-observability
    when: provisioning.image_factory.enabled == true && provisioning_effective.metrics == true
    resources:
      - components:
          - prometheus/alerts/image-factory
          - grafana/dashboards/image-factory
        timeout: 5m
        interval: 5m

  # Neither needs omni/exporter: both work from Omni's native metrics alone, which
  # telemetry.metrics.enabled already scrapes.
  - name: manager-observability
    when: provisioning_effective.omni == true && provisioning_effective.metrics == true
    resources:
      - components:
          - prometheus/alerts/omni
          - grafana/dashboards/omni
        timeout: 5m
        interval: 5m

messages:
  - when: provisioning_effective.omni_generated_key == true && dev != true
    text: |-
      Omni's etcd encryption key was generated in-cluster and exists nowhere else.
      Export it and store it outside the cluster, for example in your secrets manager:

        kubectl get secret omni-etcd-encryption-key-generated -n provisioning \
          -o jsonpath='{.data.omni\.asc}' | base64 -d

      Without that copy, losing the Secret leaves Omni's etcd data unreadable.
